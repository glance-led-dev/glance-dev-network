name: Refresh Athlete Tracker players

# Every Monday, re-rank the player dropdowns of the four Athlete Tracker apps
# (NFL, NBA, NHL, MLB) by ESPN fantasy ownership and open a PR if a list changed.
# Trades need nothing: the apps read team, number and colours live from ESPN.
on:
  schedule:
    - cron: "0 9 * * 1"     # Mondays 09:00 UTC
  workflow_dispatch:         # "Run workflow" button, e.g. after a trade deadline
    inputs:
      top:
        description: Players per league
        default: "750"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the player dropdowns
        run: python tools/athlete_tracker_players.py --top "${{ github.event.inputs.top || '750' }}"
      - name: Open or update the refresh PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/athlete-tracker-players
          delete-branch: true
          title: "Athlete Tracker: weekly player list refresh"
          commit-message: "athlete-tracker: refresh player dropdowns from ESPN"
          body: |
            Weekly refresh of the Athlete Tracker player dropdowns (top players per league by ESPN fantasy ownership).
            The lookup tables only grow, so panels already set to a player who left the list keep working.
            Generated by `.github/workflows/athlete-tracker-players.yml`.
          add-paths: |
            apps/athlete-tracker-*/manifest.yaml
            apps/athlete-tracker-*/app.star
