gdn: 1
id: prediction-market-ticker
version: 0.4.0
name: "Prediction Market Ticker"
author: "jxshymetersky"
description: Your prediction market odds, football matchups, scores and game clocks. Choose your positions and rotate every minute. Requires your own feed URL.
category: Finance
entry: app.star
width: 64
height: 32
refresh: 60
pages: [main]
inputs:
  - key: feedurl
    type: string
    app_input_type: free-text
    label: "Feed URL"
    help: "Paste your own JSON feed address. See the app setup guide to connect Kalshi."
    default: ""
  - key: league
    type: string
    app_input_type: dropdown
    label: "League for older feeds"
    help: "Leave Auto for new feeds. Choose NFL or CFB only for an older feed containing that league."
    default: "Auto"
    choices: ["Auto", "NFL", "CFB"]
  - key: mode
    type: string
    app_input_type: dropdown
    label: "Position display"
    default: "Rotate"
    choices: ["Rotate", "Pin one"]
  - key: hold
    type: string
    app_input_type: dropdown
    label: "Minutes per position"
    default: "1"
    choices: ["1", "2", "3", "5"]
  - key: show
    type: string
    app_input_type: dropdown
    label: "Show positions"
    default: "All positions"
    choices: ["All positions", "NFL", "CFB", "Live games"]
  - key: positions
    type: string
    app_input_type: free-text
    label: "Choose specific positions (optional)"
    help: "Comma-separated market tickers from your feed. Leave blank for all. Positions sort by ticker."
    default: ""
  - key: pin
    type: string
    app_input_type: free-text
    label: "Pinned position number"
    help: "Used with Pin one. Enter the position number shown on the display, within your filtered list."
    default: "1"
  - key: scores
    type: string
    app_input_type: dropdown
    label: "Scores and game clock"
    help: "Snapshots refresh once a minute; the game clock does not count down between refreshes."
    default: "Show"
    choices: ["Show", "Hide"]
