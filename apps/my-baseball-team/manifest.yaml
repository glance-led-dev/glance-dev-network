id: my-baseball-team
version: 0.1.0
name: My Baseball Team
author: joelfullyseeking
description: "Your ball club, logo against logo: pick two MLB teams. Each page shows the live score, the latest final, or the next game. Set the first team to None to switch the app off. Companion to My Teams Board — a display holds at most 8 pages per app, so baseball gets its own."
category: Sports
entry: app.star

width: 64
height: 32
refresh: 900

pages: [mlb1, mlb2]

inputs:
  - key: mlb1
    type: choice
    app_input_type: dropdown
    label: "MLB team"
    default: "Los Angeles Dodgers"
    help: "One page for this team. None switches the app off."
    choices: ["None", "Arizona Diamondbacks", "Athletics", "Atlanta Braves", "Baltimore Orioles", "Boston Red Sox", "Chicago Cubs", "Chicago White Sox", "Cincinnati Reds", "Cleveland Guardians", "Colorado Rockies", "Detroit Tigers", "Houston Astros", "Kansas City Royals", "Los Angeles Angels", "Los Angeles Dodgers", "Miami Marlins", "Milwaukee Brewers", "Minnesota Twins", "New York Mets", "New York Yankees", "Philadelphia Phillies", "Pittsburgh Pirates", "San Diego Padres", "San Francisco Giants", "Seattle Mariners", "St. Louis Cardinals", "Tampa Bay Rays", "Texas Rangers", "Toronto Blue Jays", "Washington Nationals"]
