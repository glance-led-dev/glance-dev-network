gdn: 1
id: super-bowl-history
version: 0.1.0
name: Super Bowl History
author: glance-led-dev
description: Every Super Bowl from I to LX - the champion and runner-up logos, the final score beside a pixel-art Lombardi Trophy, the MVP, date, host city and story, pinned on its anniversary - plus each franchise's trophy case, the MVP leaders and the countdown to Super Bowl LXI. Static, no network.
category: Sports
entry: app.star

width: 192
height: 32
# 60 s because each page steps through its rotation one screen per minute.
# The data is baked in, so nothing is fetched.
refresh: 60

pages: [game, rings, legends]

# Team logos: 40 x 24 pixel art, one per club, named by ESPN abbreviation,
# plus the NFL shield.
assets:
  - ARI.png
  - ATL.png
  - BAL.png
  - BUF.png
  - CAR.png
  - CHI.png
  - CIN.png
  - CLE.png
  - DAL.png
  - DEN.png
  - DET.png
  - GB.png
  - HOU.png
  - IND.png
  - JAX.png
  - KC.png
