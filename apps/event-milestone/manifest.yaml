gdn: 1
id: event-milestone
version: 0.1.0
name: Event Milestone
author: ShulinZhou
description: Days since - or days to - your weddings, birthdays and graduations, with themed pixel art and a count colour per event. Up to five events take turns on the panel.
category: Lifestyle
entry: app.star

width: 192
height: 32
refresh: 60

pages: [since]

inputs:
  - key: event1
    type: string
    app_input_type: free-text
    label: Event 1 name
    default: "WEDDING"
    help: "Completes the title: DAYS SINCE ___ (or DAYS TO ___). Leave blank to use the theme name."
  - key: date1
    type: string
    app_input_type: date
    label: Event 1 date
    default: "2019-06-15"
    help: A past date counts up from it; a future date counts down to it.
  - key: theme1
    type: string
    app_input_type: dropdown
    label: Event 1 theme
    default: Wedding
    choices:
      - Wedding
      - Birthday
      - Graduation
      - House
      - Car
      - Bicycle
      - Yacht
      - Departure
      - Arrival
      - Tree
      - Flower
      - Beach
      - Mountains
      - "Torii Gate"
      - Pagoda
      - Heart
      - Couple
      - "Couple Blue"
      - "Couple Pink"
      - Girl
      - Boy
      - Campfire
      - Helicopter
      - Paraglider
      - Fishing
      - Running
      - "Gold Medal"
      - "Silver Medal"
      - "Bronze Medal"
      - Trophy
      - Podium
      - Soccer
      - Football
      - Basketball
      - Badminton
      - Volleyball
      - Hockey
      - Skiing
      - Chess
      - Golf
  - key: numcolor1
    type: string
    app_input_type: color
    label: Event 1 number color
    default: "#FFFFFF"
    help: The colour of this event's day count.

