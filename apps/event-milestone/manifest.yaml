gdn: 1
id: event-milestone
version: 0.1.0
name: Event Milestone
author: ShulinZhou
description: Days since - or days to - your wedding, birthday, graduation or other milestone, with themed pixel art and a count colour you choose.
category: Lifestyle
entry: app.star

width: 192
height: 32
refresh: 21600

pages: [since]

inputs:
  - key: event
    type: string
    app_input_type: free-text
    label: Event name
    default: "WEDDING"
    help: "Completes the title: DAYS SINCE ___ (or DAYS TO ___). Leave blank to use the theme name."
  - key: date
    type: string
    app_input_type: date
    label: Event date
    default: "2019-06-15"
    help: A past date counts up from it; a future date counts down to it.
  - key: theme
    type: choice
    app_input_type: dropdown
    label: Event theme
    default: Wedding
    choices:
      - Wedding
      - Birthday
      - Graduation
      - House
      - Car
      - Bicycle
      - Yacht
      - Departure
      - Arrival
      - Tree
      - Flower
      - Beach
      - Mountains
      - "Torii Gate"
      - Pagoda
      - Heart
      - Couple
      - "Couple Blue"
      - "Couple Pink"
      - Girl
      - Boy
      - Campfire
      - Helicopter
      - Paraglider
      - Fishing
      - Running
      - "Gold Medal"
      - "Silver Medal"
      - "Bronze Medal"
      - Trophy
      - Podium
      - Soccer
      - Football
      - Basketball
      - Badminton
      - Volleyball
      - Hockey
      - Skiing
      - Chess
      - Golf
  - key: numcolor
    type: choice
    app_input_type: dropdown
    label: Event color
    default: Pink
    choices: [Red, Yellow, Green, Blue, Purple, Pink]
    help: The colour of the event's name and day count.

  - key: accent
    type: choice
    app_input_type: dropdown
    label: Accent color
    default: Purple
    choices: [Red, Yellow, Green, Blue, Purple, Pink]
    help: The edge rail.
