gdn: 1
id: household-attention
version: 0.3.0
name: Household Attention
author: Household Intelligence contributors
description: Private household attention counts or explicitly shared task titles, with expiry and source warnings.
category: Productivity
entry: app.star
width: 384
height: 32
refresh: 600
pages: [main, second, third, fourth, fifth]
inputs:
  - key: endpoint
    type: string
    app_input_type: free-text
    label: Read-only LED feed
    default: ""
    help: HTTPS relay URL or hostname/path. Never enter the management address.
  - key: readkey
    type: string
    app_input_type: api-key
    label: LED read key
    default: ""
  - key: mode
    type: string
    app_input_type: dropdown
    label: Items to show
    default: All five
    choices: [All five, Fixed rank]
  - key: item
    type: string
    app_input_type: dropdown
    label: Ranked item (Fixed rank mode only)
    default: "1"
    choices: ["1", "2", "3", "4", "5"]
  - key: preview
    type: string
    app_input_type: dropdown
    label: Offline preview
    default: Live
    choices: [Live, Counts, Item, Empty, Stale, Error, Long title]
    help: Preview modes use clearly labelled synthetic examples locally and make no network requests.
assets: [google-tasks.png, google-calendar.png, alexa.png, whisker.png, petlibro.png, task-filter.png, task-plane.png, task-shopping.png, task-task.png]
