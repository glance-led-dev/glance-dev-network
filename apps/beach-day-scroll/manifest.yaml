gdn: 1
id: beach-day-scroll
version: 0.1.0
name: Beach Day
author: glance-led-dev
description: One score for whether today is a beach day — warmth, sun, wind and rain together.
category: Weather
entry: app.star

width: 192
height: 32
refresh: 3600

pages: [score]

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "90265"
    help: US zip near the coast.
  - key: units
    type: choice
    app_input_type: dropdown
    label: Units
    default: "IMPERIAL"
    choices: ["IMPERIAL", "METRIC"]
