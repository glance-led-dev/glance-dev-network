gdn: 1
id: nearby-aircraft
version: 0.1.0
name: Nearby Aircraft
author: ceickholt
description: Track the most relevant aircraft near a U.S. ZIP code with route, speed, altitude, distance, data age, and color-coded type hints.
category: Transportation
entry: app.star
width: 64
height: 32
refresh: 240

pages:
  - aircraft1
  - aircraft2
  - aircraft3
  - aircraft4

inputs:
  - key: zipcode
    type: string
    label: ZIP Code
    help: "Centre of the search. The panel shows aircraft currently in the sky around it, closest first."
    app_input_type: free-text
    default: "10001"
  - key: radius
    type: string
    label: Search Radius
    help: "How far out to look, in nautical miles."
    app_input_type: dropdown
    choices:
      - "10"
      - "25"
      - "50"
      - "100"
    default: "25"
  - key: airborneonly
    type: string
    label: Airborne Only
    help: "On by default. Turn off to include aircraft parked or taxiing at nearby airports."
    app_input_type: checkbox
    default: true
  - key: sortmode
    type: string
    label: Sort Mode
    help: "CLOSEST is the usual choice. INTERESTING favours emergencies, military and unusual traffic."
    app_input_type: dropdown
    choices:
      - "INTERESTING"
      - "CLOSEST"
      - "FASTEST"
      - "HIGHEST"
      - "FRESHEST"
    default: "CLOSEST"
  - key: watch
    type: choice
    label: Show First
    help: "Bumps one kind of aircraft to the top of the list. Emergencies always come first regardless."
    app_input_type: dropdown
    choices:
      - "NONE"
      - "MILITARY"
      - "HELICOPTERS"
    default: "NONE"
  - key: accent
    type: string
    label: Accent Color
    help: Default icon color when no special highlight applies.
    app_input_type: color
    default: "#29D682"
