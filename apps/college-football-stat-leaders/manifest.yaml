gdn: 1
id: college-football-stat-leaders
version: 0.1.0
name: College Football Stat Leaders
author: glance-led-dev
description: The FBS national stat leaders - passing, QB rating, rushing, receiving, tackles, sacks and interceptions - one player at a time with a gold, silver or bronze medal, the school's logo, his jersey stripe and the number that put him there, plus how far he leads or trails. Filter by stat family or conference. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 120 s: each frame shows one leader and the rotation steps every two
# minutes. The ESPN leaders feed is cached for 1800 s - college stats only
# move on game days. Inputs: 5 stat families x 12 conferences = 60
# combinations, under the 100 allowed below a 5-minute refresh.
refresh: 120

pages: [leaders]

# School logos: 40 x 24 pixel art, one per FBS program, named by ESPN
# abbreviation.
