inputs:
  - key: stat
    type: choice
    app_input_type: dropdown
    label: Stat
    default: "ALL STATS"
    help: ALL STATS rotates through all eleven leaderboards, one board (its top 3) every two minutes. PASSING is yards, touchdowns and QB rating; RUSHING yards and touchdowns; RECEIVING yards, catches and touchdowns; DEFENSE tackles, sacks and interceptions; TOUCHDOWNS the passing, rushing and receiving touchdown leaders.
    choices:
      - "ALL STATS"
      - "PASSING"
      - "RUSHING"
      - "RECEIVING"
      - "DEFENSE"
      - "TOUCHDOWNS"
    options:
      - "ALL STATS"
      - "PASSING"
      - "RUSHING"
      - "RECEIVING"
      - "DEFENSE"
      - "TOUCHDOWNS"
  - key: conference
    type: choice
    app_input_type: dropdown
    label: Conference
    default: "ALL FBS"
    help: ALL FBS ranks every FBS player nationally. Pick a conference, or INDEPENDENTS (Notre Dame, UConn), to see only its leaders.
    choices:
      - "ALL FBS"
      - "SEC"
      - "BIG TEN"
      - "BIG 12"
      - "ACC"
      - "AMERICAN"
      - "MOUNTAIN WEST"
      - "SUN BELT"
      - "MAC"
      - "CONFERENCE USA"
      - "PAC-12"
      - "INDEPENDENTS"
    options:
