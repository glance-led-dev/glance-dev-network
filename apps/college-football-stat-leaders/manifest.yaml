gdn: 1
id: college-football-stat-leaders
version: 0.1.0
name: College Football Stat Leaders
author: glance-led-dev
description: The FBS national stat leaders run as a race - the top 3 in passing, QB rating, rushing, receiving, tackles, sacks or interceptions as bars in each school's colours with the number at the tip and the school's logo hanging from it like a pennant, and gold, silver and bronze starting blocks. Filter by stat family, touchdowns, or conference. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 120 s: each frame shows one leaderboard's top 3 and the rotation steps
# every two minutes. The ESPN leaders feed is cached for 1800 s - college stats only
# move on game days. Inputs: 6 stat choices x 12 conferences = 72
# combinations, under the 100 allowed below a 5-minute refresh.
refresh: 900

pages: [leaders]

# School logos: 24 x 18 pixel art (the catalog's small NCAA set), one per
# FBS program, named by ESPN abbreviation (Texas A&M as TAMU: '&' is not a
# legal asset name).
