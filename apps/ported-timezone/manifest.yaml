gdn: 1
id: ported-timezone
version: 0.3.0
name: Timezone
author: tidbyt-community
description: Live local time for any major world timezone, daylight saving included. The official tidbyt/pixlet Location example, ported to GDN — translated then hand-finished.
category: Time
entry: app.star
# tronbyt/Pixlet native size.
width: 64
height: 32
refresh: 60
pages: [main]
inputs:
  - key: tz
    type: choice
    app_input_type: dropdown
    label: Timezone
    default: "NEW YORK"
    help: Daylight saving is applied automatically for zones that observe it.
    choices:
      - "HONOLULU"
      - "ANCHORAGE"
      - "LOS ANGELES"
      - "PHOENIX"
      - "DENVER"
      - "CHICAGO"
      - "NEW YORK"
      - "HALIFAX"
      - "MEXICO CITY"
      - "BOGOTA"
      - "SAO PAULO"
      - "BUENOS AIRES"
      - "REYKJAVIK"
      - "LISBON"
      - "DUBLIN"
      - "LONDON"
      - "MADRID"
      - "PARIS"
      - "AMSTERDAM"
      - "BERLIN"
      - "ROME"
      - "STOCKHOLM"
      - "WARSAW"
      - "ATHENS"
      - "ISTANBUL"
      - "KYIV"
      - "MOSCOW"
      - "LAGOS"
      - "CAIRO"
      - "NAIROBI"
      - "JOHANNESBURG"
      - "JERUSALEM"
      - "DUBAI"
      - "KARACHI"
      - "KOLKATA"
      - "DHAKA"
      - "BANGKOK"
      - "JAKARTA"
      - "SINGAPORE"
      - "MANILA"
      - "HONG KONG"
      - "SHANGHAI"
      - "SEOUL"
      - "TOKYO"
      - "PERTH"
      - "BRISBANE"
      - "SYDNEY"
      - "AUCKLAND"
      - "UTC"
  - key: hourformat
    type: choice
    app_input_type: dropdown
    label: Hour format
    default: "12"
    choices: ["12", "24"]