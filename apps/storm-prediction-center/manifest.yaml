id: storm-prediction-center
name: SPC Convective Outlook
category: weather
author: "uel"
description: NWS Storm Prediction Center convective outlook for your ZIP code. Days 1-3 risk categories, Day 1 and Day 2 tornado, wind and hail probabilities with CIG levels, and an MD badge when a Mesoscale Discussion covers you.
width: 64
height: 32
refresh: 1800
pages:
  - title
  - outlook
  - day1
  - hazard1
  - hazard2
inputs:
  - key: zip
    name: zip
    type: string
    label: ZIP code
    help: US ZIP code in the lower 48. Sets the location; the city name is looked up from it.
    app_input_type: free-text
    default: "73069"
