id: storm-prediction-center
name: SPC Convective Outlook
category: weather
author: uel
description: NWS Storm Prediction Center convective outlook for your location. Days 1-3 categories, Day 1 and Day 2 tornado, wind and hail probabilities with CIG levels, and an MD badge when a Mesoscale Discussion covers you.
width: 64
height: 32
refresh: 900
pages:
  - title
  - outlook
  - day1
  - hazard1
  - hazard2
inputs:
  - key: location
    name: location
    label: Location as latitude,longitude (use a negative longitude, for example 39.45,-75.72)
    app_input_type: free-text
    default: ""
  - key: placename
    name: placename
    label: Name shown on the title page (optional, blank shows the coordinates)
    app_input_type: free-text
    default: ""
