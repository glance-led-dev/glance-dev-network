gdn: 1
id: metar
version: 0.1.0
name: METAR
author: glance-led-dev
description: Airport weather the way pilots read it — flight category, wind, visibility, ceiling and the cloud stack above the field. Free NWS data, no API key.
category: Weather
entry: app.star

width: 192
height: 32
refresh: 1800

pages: [metar, sky]

inputs:
  - key: airport
    type: string
    app_input_type: free-text
    label: Airport
    default: "KJFK"
    help: An ICAO airport code — KJFK, KSFO, EGLL, LFPG. Four letters, not the three-letter airline code.
