gdn: 1
id: nws-alerts
version: 0.1.0
name: Weather Alerts
author: glance-led-dev
description: "Active National Weather Service warnings, watches and advisories for your zip."
category: Weather
entry: app.star

width: 64
height: 32
refresh: 1800

pages: [alert]

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: "US zip code. Sets your timezone, daylight saving included."
