id: where-in-the-sky
name: Where in the Sky is...
author: cfdmb
description: Where to look for the planets and the Moon from your zip code - right now or when next visible, rise and set, the next four nights, tonight's whole sky, the Moon's phase and close passes coming up.
category: Science
width: 192
height: 32
refresh: 3600
pages:
  - look
  - aim
  - rise_set
  - timeline
  - sky_tonight
  - up_tonight
  - moon_phase
  - sky_events
inputs:
  - key: body
    type: string
    app_input_type: dropdown
    label: Body
    choices: [Best Tonight, Moon, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune]
    default: Best Tonight
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: A US zip code - used to look up your latitude/longitude.
