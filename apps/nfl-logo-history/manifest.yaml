gdn: 1
id: nfl-logo-history
version: 0.1.0
name: NFL Logo History
author: glance-led-dev
description: Every primary logo an NFL club has worn, oldest to newest on a timeline with the season each one debuted and the cities along the way, flowing into today's logo, plus the club's longest-serving logo. Pick a club or rotate through all 32. No network needed.
category: Sports
entry: app.star

width: 192
height: 32
# 60 s: the timeline steps one frame (up to five older logos) per minute. There is
# no network, so the refresh costs nothing; 33 dropdown choices is inside the
# 48-combination limit for a sub-2-minute refresh.
refresh: 3600

pages: [timeline, firstnow]

