gdn: 1
id: fantasy-football-news-scroll
version: 0.1.0
name: Fantasy Football News
author: glance-led-dev
description: Live NFL player news for all teams, one NFL team, or your Sleeper roster, plus trending waiver adds and drops with optional league availability. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 60 s because each page rotates one story / one player per minute. The
# feeds themselves are cached far longer: news 600 s, trending 1800 s,
# player records 6 h.
refresh: 60

pages: [news, wire]

# Team logos: 40 x 24 pixel art, one per club, named by ESPN abbreviation,
# plus the NFL shield for news that names no club.
assets:
  - ARI.png
  - ATL.png
  - BAL.png
  - BUF.png
  - CAR.png
  - CHI.png
  - CIN.png
  - CLE.png
  - DAL.png
  - DEN.png
  - DET.png
  - GB.png
  - HOU.png
  - IND.png
  - JAX.png
  - KC.png
  - LV.png
  - LAC.png
  - LAR.png
  - MIA.png
  - MIN.png
  - NE.png
  - NO.png
  - NYG.png
  - NYJ.png
  - PHI.png
  - PIT.png
  - SF.png
  - SEA.png
  - TB.png
  - TEN.png
  - WSH.png
  - NFL.png

inputs:
  - key: follow
    type: choice
    app_input_type: dropdown
    label: News for
    default: "ALL NFL"
    help: ALL NFL shows RotoWire news league-wide. Pick an NFL team for its ESPN player updates, or MY SLEEPER TEAM for news about your Sleeper roster (requires username and league ID).
    choices:
      - "ALL NFL"
      - "MY SLEEPER TEAM"
      - "ARIZONA CARDINALS"
      - "ATLANTA FALCONS"
      - "BALTIMORE RAVENS"
      - "BUFFALO BILLS"
      - "CAROLINA PANTHERS"
      - "CHICAGO BEARS"
      - "CINCINNATI BENGALS"
      - "CLEVELAND BROWNS"
      - "DALLAS COWBOYS"
      - "DENVER BRONCOS"
      - "DETROIT LIONS"
      - "GREEN BAY PACKERS"
      - "HOUSTON TEXANS"
      - "INDIANAPOLIS COLTS"
      - "JACKSONVILLE JAGUARS"
      - "KANSAS CITY CHIEFS"
      - "LAS VEGAS RAIDERS"
      - "LOS ANGELES CHARGERS"
      - "LOS ANGELES RAMS"
      - "MIAMI DOLPHINS"
      - "MINNESOTA VIKINGS"
      - "NEW ENGLAND PATRIOTS"
      - "NEW ORLEANS SAINTS"
      - "NEW YORK GIANTS"
      - "NEW YORK JETS"
      - "PHILADELPHIA EAGLES"
      - "PITTSBURGH STEELERS"
      - "SAN FRANCISCO 49ERS"
      - "SEATTLE SEAHAWKS"
      - "TAMPA BAY BUCCANEERS"
      - "TENNESSEE TITANS"
      - "WASHINGTON COMMANDERS"
  - key: sleeperusername
    type: string
    app_input_type: free-text
    label: Sleeper username
    default: ""
    help: Your Sleeper account username; used to find your roster when News for is MY SLEEPER TEAM.
  - key: sleeperleagueid
    type: string
    app_input_type: free-text
    label: Sleeper league ID
    default: ""
    help: The numeric ID from your Sleeper league URL.
  - key: leaguewire
    type: string
    app_input_type: checkbox
    label: Show only players available in my league
    default: false
    help: Filter trending waiver players against every roster in your Sleeper league. Requires a league ID.
  - key: wire
    type: choice
    app_input_type: dropdown
    label: Waiver wire
    default: "ADDS"
    help: ADDS shows the players fantasy managers are grabbing most in the last 24 hours; DROPS shows who they are cutting. From Sleeper.
    choices:
      - "ADDS"
      - "DROPS"
  - key: position
    type: choice
    app_input_type: dropdown
    label: Waiver wire position
    default: "ALL"
    help: Narrow the waiver wire page to one position. The news page is not filtered by this.
    choices:
      - "ALL"
      - "QB"
      - "RB"
      - "WR"
      - "TE"
      - "K"
      - "DEF"
