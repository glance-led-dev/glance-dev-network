gdn: 1
id: commodities-at-a-glance-scroll
version: 0.1.0
name: Commodities at a Glance
author: glance-led-dev
description: Six commodities as pixel art and a price - cattle, corn, soybeans, crude, gold, whatever you pick - with the unit and the day's move. Front-month futures, no key needed.
category: Finance
entry: app.star

width: 192
height: 32
# Ten minutes, and the fetch ttl matches.
refresh: 600

pages: [pageone, pagetwo]

inputs:
  - key: slotone
    type: choice
    app_input_type: dropdown
    label: Page 1, left
    default: "LIVE CATTLE"
    help: Which commodity fills this tile. Pick NONE to leave it empty.
    choices: ["NONE", "LIVE CATTLE", "FEEDER CATTLE", "LEAN HOGS", "CORN", "SOYBEANS", "WHEAT", "OATS", "CRUDE OIL", "NATURAL GAS", "GOLD", "SILVER", "COPPER", "COFFEE", "SUGAR", "COTTON", "COCOA", "ORANGE JUICE"]
  - key: slottwo
    type: choice
    app_input_type: dropdown
    label: Page 1, middle
    default: "CORN"
    help: Which commodity fills this tile. Pick NONE to leave it empty.
    choices: ["NONE", "LIVE CATTLE", "FEEDER CATTLE", "LEAN HOGS", "CORN", "SOYBEANS", "WHEAT", "OATS", "CRUDE OIL", "NATURAL GAS", "GOLD", "SILVER", "COPPER", "COFFEE", "SUGAR", "COTTON", "COCOA", "ORANGE JUICE"]
  - key: slotthree
    type: choice
    app_input_type: dropdown
    label: Page 1, right
    default: "SOYBEANS"
    help: Which commodity fills this tile. Pick NONE to leave it empty.
    choices: ["NONE", "LIVE CATTLE", "FEEDER CATTLE", "LEAN HOGS", "CORN", "SOYBEANS", "WHEAT", "OATS", "CRUDE OIL", "NATURAL GAS", "GOLD", "SILVER", "COPPER", "COFFEE", "SUGAR", "COTTON", "COCOA", "ORANGE JUICE"]
  - key: slotfour
    type: choice
    app_input_type: dropdown
    label: Page 2, left
    default: "CRUDE OIL"
    help: Which commodity fills this tile. Pick NONE to leave it empty.
    choices: ["NONE", "LIVE CATTLE", "FEEDER CATTLE", "LEAN HOGS", "CORN", "SOYBEANS", "WHEAT", "OATS", "CRUDE OIL", "NATURAL GAS", "GOLD", "SILVER", "COPPER", "COFFEE", "SUGAR", "COTTON", "COCOA", "ORANGE JUICE"]
  - key: slotfive
    type: choice
    app_input_type: dropdown
    label: Page 2, middle
    default: "GOLD"
    help: Which commodity fills this tile. Pick NONE to leave it empty.
    choices: ["NONE", "LIVE CATTLE", "FEEDER CATTLE", "LEAN HOGS", "CORN", "SOYBEANS", "WHEAT", "OATS", "CRUDE OIL", "NATURAL GAS", "GOLD", "SILVER", "COPPER", "COFFEE", "SUGAR", "COTTON", "COCOA", "ORANGE JUICE"]
  - key: slotsix
    type: choice
    app_input_type: dropdown
    label: Page 2, right
    default: "WHEAT"
    help: Which commodity fills this tile. Pick NONE to leave it empty.
    choices: ["NONE", "LIVE CATTLE", "FEEDER CATTLE", "LEAN HOGS", "CORN", "SOYBEANS", "WHEAT", "OATS", "CRUDE OIL", "NATURAL GAS", "GOLD", "SILVER", "COPPER", "COFFEE", "SUGAR", "COTTON", "COCOA", "ORANGE JUICE"]
