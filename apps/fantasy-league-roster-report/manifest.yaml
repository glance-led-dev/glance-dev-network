gdn: 1
id: fantasy-league-roster-report
version: 0.1.0
name: My Roster Report
author: glance-led-dev
description: Your own ESPN or Sleeper fantasy lineup as a locker room - one stall per starter, each jersey in its status colour, the hurt ones flagged on their nameplates, your crest at the far end and the READY count on the bench. A second page is the trainer's clipboard for each player who needs a decision, most urgent first - hurt starters, IR-slot players ready to activate, starters on bye, then hurt bench players - with his team logo, the game and its kickoff deadline, his projection, the bench cover at his position and a body figure that lights up where he is hurt. Enter your league ID and team name.
category: Sports
entry: app.star

width: 192
height: 32
# 300 s: the league ID and team are free text (the under-5-minute rule
# allows only dropdown / checkbox / selection inputs). Each refresh moves the
# report on to the next player.
refresh: 300

pages: [lineup, report]

# Team logos: 40 x 24 pixel art named by ESPN abbreviation, plus the NFL shield.
assets:
  - ARI.png
  - ATL.png
  - BAL.png
  - BUF.png
  - CAR.png
  - CHI.png
  - CIN.png
  - CLE.png
  - DAL.png
  - DEN.png
  - DET.png
  - GB.png
  - HOU.png
  - IND.png
  - JAX.png
  - KC.png
  - LV.png
  - LAC.png
  - LAR.png
  - MIA.png
  - MIN.png
  - NE.png
  - NO.png
  - NYG.png
  - NYJ.png
  - PHI.png
  - PIT.png
  - SF.png
  - SEA.png
  - TB.png
  - TEN.png
  - WSH.png
  - NFL.png

inputs:
  - key: league
    type: string
    app_input_type: free-text
    label: League ID
    default: ""
    help: "The number in your league's web address - ESPN (leagueId=...) or Sleeper (sleeper.com/leagues/...). Leave blank for a demo."
  - key: team
    type: string
    app_input_type: free-text
    label: Your team
    default: ""
    help: "Your team name or your manager / username. Part of it is fine, any case."
  - key: platform
    type: choice
    app_input_type: dropdown
    label: Platform
    default: "AUTO"
    help: "AUTO works it out from the ID (Sleeper IDs are 18-19 digits). Yahoo leagues are not supported - Yahoo needs a sign-in a panel can't do."
    choices:
      - "AUTO"
      - "ESPN"
      - "SLEEPER"
    options:
      - "AUTO"
      - "ESPN"
      - "SLEEPER"
  - key: espns2
    type: string
    app_input_type: api-key
    label: ESPN espn_s2 cookie (private leagues only)
    default: ""
    help: "Only for PRIVATE ESPN leagues. In a desktop browser logged into ESPN, open your league, then DevTools > Application > Cookies > espn.com and copy espn_s2."
  - key: swid
    type: string
    app_input_type: api-key
    label: ESPN SWID cookie (private leagues only)
    default: ""
    help: "Only for PRIVATE ESPN leagues. From the same cookie list, copy SWID (the value in curly braces)."
