gdn: 1
id: google-calendar
version: 0.1.0
name: Google Calendar
author: glance-led-dev
description: Your next meeting, today's agenda, and the week ahead, read straight from a Google Calendar secret iCal address. No OAuth and no API key.
category: Productivity
entry: app.star

width: 64
height: 32

# The iCal export is a whole-calendar file, so there is nothing to gain from
# asking for it faster than a person edits a calendar.
refresh: 300

pages: [splash, next, today, week]

inputs:
  - key: calid
    type: string
    app_input_type: free-text
    label: Calendar ID
    default: "en.usa#holiday@group.v.calendar.google.com"
    help: >-
      In Google Calendar: Settings, pick your calendar, Integrate calendar,
      "Secret address in iCal format". Paste the part BETWEEN /ical/ and
      /private-, e.g. you@gmail.com or c9f2b4@group.calendar.google.com. Do not
      paste the whole https:// link -- the colon in it stops the value ever
      reaching the app. The default is Google's public US holiday calendar, so
      the app shows something real before you have set it up; replace it with
      your own.
  # A credential, not a preference: anyone holding this token can read the whole
  # calendar, so it is declared api-key. That masks it in the Studio and marks
  # it for the platform to hold as a secret rather than a plain setting.
  - key: icalkey
    type: string
    app_input_type: api-key
    label: Secret key
    default: ""
    help: >-
      The private-XXXX token from that same address, with or without the
      "private-" prefix. Anyone with it can read this calendar, so treat it like
      a password -- Google can rotate it from the same settings page. Leave
      blank if the calendar is public.
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    help: Pick the city nearest you. Daylight saving is applied automatically, so this never needs changing twice a year.
    choices:
      - "Pacific/Honolulu"
      - "America/Anchorage"
      - "America/Los_Angeles"
      - "America/Phoenix"
      - "America/Denver"
      - "America/Chicago"
      - "America/Mexico_City"
      - "America/New_York"
      - "America/Bogota"
      - "America/Halifax"
      - "America/Sao_Paulo"
      - "America/Argentina/Buenos_Aires"
      - "UTC"
      - "Europe/Lisbon"
      - "Europe/Dublin"
      - "Europe/London"
      - "Europe/Madrid"
      - "Europe/Paris"
      - "Europe/Amsterdam"
      - "Europe/Berlin"
      - "Europe/Rome"
      - "Europe/Stockholm"
      - "Europe/Warsaw"
      - "Africa/Lagos"
      - "Europe/Athens"
      - "Europe/Helsinki"
      - "Africa/Johannesburg"
      - "Europe/Moscow"
      - "Africa/Nairobi"
      - "Asia/Dubai"
      - "Asia/Karachi"
      - "Asia/Kolkata"
      - "Asia/Dhaka"
      - "Asia/Bangkok"
      - "Asia/Jakarta"
      - "Asia/Shanghai"
      - "Asia/Singapore"
      - "Asia/Hong_Kong"
      - "Australia/Perth"
      - "Asia/Tokyo"
      - "Asia/Seoul"
      - "Australia/Adelaide"
      - "Australia/Brisbane"
      - "Australia/Sydney"
      - "Australia/Melbourne"
      - "Pacific/Auckland"
      - "Atlantic/Reykjavik"
      - "Europe/Kyiv"
      - "Europe/Istanbul"
      - "Africa/Cairo"
      - "Asia/Jerusalem"
      - "Asia/Manila"
  - key: hours
    type: choice
    app_input_type: dropdown
    label: Hours shown on the week strip
    default: "Auto - fit my events"
    help: Auto sizes the strip to whatever is actually in your week, so a morning of meetings fills it instead of hiding in the top third. The fixed windows are there if you would rather the shape stayed the same every day.
    choices:
      - "Auto - fit my events"
      - "Work hours (9am to 5pm)"
      - "Work hours (8am to 6pm)"
      - "Waking hours (7am to 11pm)"
      - "Whole day (midnight to midnight)"
  - key: hidealldays
    type: choice
    app_input_type: dropdown
    label: All-day events
    default: "Show"
    choices: ["Show", "Hide"]
    help: Hide keeps birthdays and holidays out of the agenda.
