gdn: 1
id: nhl-west-wildcard-standings
version: 0.1.0
name: "NHL Wild Card Standings"
author: "MinifieTech"
description: NHL division leaders, wild card spots and the playoff hunt for the Western or Eastern Conference.
category: Sports
entry: app.star
width: 192
height: 32
refresh: 300
pages: [conference, division1_title, division1, division2_title, division2, wildcard_title, wildcard, hunt]

inputs:
  - key: conference
    type: choice
    app_input_type: dropdown
    label: Conference
    default: Western
    choices: [Western, Eastern]
    help: Which conference's division leaders, wild card spots and playoff hunt to show.

