# GDN app manifest (v2). This file is the source of truth for how your app is
# configured and reviewed. Edit it in VS Code or the Studio.
gdn: 1
id: date-time-scroll
version: 0.2.0
name: Date & Time (Scroll)
author: jdhine02
description: Local date, time, and current weather for a US zip code, cycling one per frame every minute. Pick a 12/24-hour clock, a US/international/written date format, a font, and a color for each section; the temperature can match the weather color or follow a hot/cold scale, and rain, snow, and clear-night moon phase are called out by name and icon.
category: Time
entry: app.star

# Panel geometry. Height is 32 (fixed); width up to 384.
width: 192
height: 32

# Re-render every minute so the clock stays current.
refresh: 60

# Pages the panel rotates through, in order. app.star must define a function per name.
pages: [main]

# What the client fills in at install time.
#   type            — the data type: string | number | choice
#   app_input_type  — the UI widget the client sees. One of:
#                     free-text | dropdown | selection | checkbox | date | date-past | color
#                     (optional; if omitted the form infers it from `type`)
inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "90210"
    help: US zip code; used to look up local time and weather.

  - key: dateformat
    type: choice
    app_input_type: dropdown
    label: Date format
    default: "MM/DD/YYYY"
    help: Common American and international date formats.
    choices:
      - "MM/DD/YYYY"
      - "MON DD, YYYY"
      - "DD/MM/YYYY"
      - "DD MON YYYY"
      - "YYYY-MM-DD"
      - "WEDNESDAY, AUGUST 5TH"

  - key: timeformat
    type: choice
    app_input_type: dropdown
    label: Time format
    default: "12"
    help: 12-hour with AM/PM, or 24-hour.
    choices: ["12", "24"]

  - key: datecolor
    type: string
    app_input_type: color
    label: Date color
    default: "#FFFFFF"

  - key: timecolor
    type: string
    app_input_type: color
    label: Time color
    default: "#FFFFFF"

  - key: weathercolor
    type: string
    app_input_type: color
    label: Weather color
    default: "#FFFFFF"

  - key: tempcolormode
    type: choice
    app_input_type: dropdown
    label: Temperature color
    default: "Weather color"
    help: Match the weather color, or color the temperature reading by a hot/cold scale (icy blue when cold, ramping to red when hot).
    choices: ["Weather color", "Temperature scale"]

  - key: font
    type: choice
    app_input_type: dropdown
    label: Font
    default: "6x8"
    help: Each frame still shrinks to a smaller font automatically if its content is too long to fit (the largest font is a hard choice and may clip instead).
    choices: ["4x5", "6x8", "8x12", "10x16", "16x24"]
