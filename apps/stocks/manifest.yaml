gdn: 1
id: stocks
version: 0.2.0
name: Stock Ticker
author: your-name
description: Live stock price and daily change for a ticker symbol, from Twelve Data.
category: Finance
entry: app.star
width: 128
height: 32
refresh: 1800
pages: [price]
inputs:
  - key: apikey
    required: true
    app_input_type: api-key
    type: string
    label: Twelve Data API key
    help: "Free key from https://twelvedata.com/apikey -- 800 calls a day on the free tier."
  - key: symbol
    type: string
    app_input_type: free-text
    label: Ticker symbol
    default: AAPL