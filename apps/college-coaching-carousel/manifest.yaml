gdn: 1
id: college-coaching-carousel
version: 0.1.0
name: College Coaching Carousel
author: glance-led-dev
description: Your college football program's head coach, live from ESPN - a pixel-art coach in your school's colours, years in charge counted in pennants, this season's record and AP rank, a trophy case of every title the coach has won - plus the longest-tenured coaches in FBS. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 900 s: the coach and the tenure ladder change a few times a year and the
# record once a week; the tenure page flips between its two frames every
# refresh. Feeds are cached longer - record 1 h, coaching staff 6 h.
refresh: 900

pages: [coach, resume, tenure]

# 40 x 24 school logos (L/) and 24 x 18 ones for the tenure ladder (S/),
# named as in the shared FBS logo set.
