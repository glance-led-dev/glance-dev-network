gdn: 1
id: college-coaching-carousel
version: 0.1.0
name: College Coaching Carousel
author: glance-led-dev
description: Your college football program's head coach, live from ESPN - a pixel-art coach in your school's colours, years in charge counted in pennants, this season's record and AP rank, and a trophy case of every title the coach has won. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 900 s: the coach changes a few times a year and the record once a week.
# Feeds are cached longer - record 1 h, coaching staff 6 h.
refresh: 14400

pages: [coach, resume]

# 24 x 18 school logos (S/), drawn unscaled on the scoreboard, named as in the shared FBS logo set.
