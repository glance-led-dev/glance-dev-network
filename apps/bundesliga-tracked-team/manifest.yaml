gdn: 1
id: bundesliga-tracked-team
version: 0.2.1
name: "Bundesliga Tracked Team"
author: "Tim McCabe"
description: Track a Bundesliga club's most recent match, next fixture, and league standing.
category: Sports
entry: app.star

width: 128
height: 32
refresh: 300

pages: [title, live_match, last_match, next_match, standing]

assets:
  - BUNDESLIGA.png
  - DOR22.png
  - MUN22.png
  - B0422.png
  - RBL22.png
  - VFB22.png
  - SGE22.png
  - SCF22.png
  - TSG22.png
  - BMG22.png
  - M0522.png
  - FCU22.png
  - SVW22.png
  - FCA22.png
  - KOE22.png
  - HSV22.png
  - S0422.png
  - SCP22.png
  - ELV22.png
  - DOR28.png
  - MUN28.png
  - B0428.png
  - RBL28.png
  - VFB28.png
  - SGE28.png
  - SCF28.png
  - TSG28.png
  - BMG28.png
  - M0528.png
  - FCU28.png
  - SVW28.png
