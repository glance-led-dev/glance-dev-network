  - SCP28.png
  - ELV28.png

inputs:
  - key: team
    type: choice
    app_input_type: dropdown
    label: Your club
    default: "DOR"
    choices:
      - "DOR"
      - "MUN"
      - "B04"
      - "RBL"
      - "VFB"
      - "SGE"
      - "SCF"
      - "TSG"
      - "BMG"
      - "M05"
      - "FCU"
      - "SVW"
      - "FCA"
      - "KOE"
      - "HSV"
      - "S04"
      - "SCP"
      - "ELV"
    help: Choose the Bundesliga club you want to track.

  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/Los_Angeles"
    choices:
      - "America/Los_Angeles"
      - "America/Denver"
      - "America/Chicago"
      - "America/New_York"
      - "UTC"
      - "Europe/Berlin"
    help: Used to display kickoff times in your local time.