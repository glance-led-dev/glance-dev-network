gdn: 1
id: international-football-scores
version: 0.1.0
name: "International Football Scores"
author: "Gary Coulter"
description: Follow a national team or a group across the UEFA Nations League, the FIFA World Cup and its qualifiers, and the UEFA European Championship and its qualifiers - live scores, fixtures, results with goalscorers, and the group table.
category: Sports
entry: app.star

width: 192
height: 32
# Live scores move fast; the live feed is fetched with a 60-120 s ttl to match.
refresh: 120

