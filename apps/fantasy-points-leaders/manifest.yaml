inputs:
  - key: position
    type: choice
    app_input_type: dropdown
    label: Position
    default: "ALL"
    help: ALL walks through QB, RB, WR, TE, K and DEF in turn, the top three at each. Pick one position to see its top five.
    choices:
      - "ALL"
      - "QB"
      - "RB"
      - "WR"
      - "TE"
      - "K"
      - "DEF"
    options:
      - "ALL"
      - "QB"
      - "RB"
      - "WR"
      - "TE"
      - "K"
      - "DEF"
  - key: scoring
    type: choice
    app_input_type: dropdown
    label: Scoring
    default: "PPR"
    help: How catches count. PPR gives a point per reception, HALF PPR half a point, STANDARD none. Kickers and defenses score the same in all three.
    choices:
      - "PPR"
      - "HALF PPR"
      - "STANDARD"
    options:
      - "PPR"
      - "HALF PPR"
      - "STANDARD"
  - key: timeframe
    type: choice
    app_input_type: dropdown
    label: Timeframe
    default: "LAST WEEK"
    help: LAST WEEK ranks the most recent week that has been played in full (it switches over once Monday night is final). SEASON ranks total points so far this season. In the offseason both show last season's final leaders.
    choices:
      - "LAST WEEK"
      - "SEASON"
    options:
      - "LAST WEEK"
      - "SEASON"
