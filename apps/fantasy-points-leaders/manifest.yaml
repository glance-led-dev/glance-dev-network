gdn: 1
id: fantasy-points-leaders
version: 0.1.0
name: Fantasy Points Leaders
author: glance-led-dev
description: Who scored the most fantasy points - last week or season to date - at every position, on a gold, silver and bronze podium and in a spotlight with the team logo and the stat line behind the score. PPR, half PPR or standard. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 180 s: each refresh moves the spotlight to the next leader (and, with ALL
# positions, the podium to the next position every third refresh). The stat
# feeds are cached 30 minutes - they only change while games are on.
refresh: 14400

pages: [podium, spotlight]

# Team logos: 40 x 24 pixel art, one per club, named by ESPN abbreviation,
# plus the NFL shield for a free agent; S/ holds the same clubs at 24 x 18
# for the podium steps.
