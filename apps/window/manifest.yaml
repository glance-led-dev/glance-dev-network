gdn: 1
id: window
version: 1.0.0
name: Window
author: reyos86
description: A window onto a national park, live. Eight public webcams from New River Gorge to Kilauea, and the panel shows whichever one the sun is highest over right now. No key, no account.
category: Travel
entry: app.star
width: 192
height: 32
refresh: 300
pages: [view, elsewhere]

inputs:
  - key: place
    type: choice
    app_input_type: dropdown
    label: Which window
    default: FOLLOW THE SUN
    choices: [FOLLOW THE SUN, NEW RIVER GORGE, YELLOWSTONE, LONGS PEAK, GRAND CANYON, LAKE MCDONALD, CRATER LAKE, MOUNT RAINIER, KILAUEA]
    options: [FOLLOW THE SUN, NEW RIVER GORGE, YELLOWSTONE, LONGS PEAK, GRAND CANYON, LAKE MCDONALD, CRATER LAKE, MOUNT RAINIER, KILAUEA]
    help: FOLLOW THE SUN shows whichever camera has the sun highest over it right now, so the panel is lit from first light in West Virginia to dusk in Hawaii. Pick a park instead to stay there, dark or not.
  - key: clock
    type: choice
    app_input_type: dropdown
    label: Clock
    default: 12 HOUR
    choices: [12 HOUR, 24 HOUR]
    options: [12 HOUR, 24 HOUR]
    help: The time shown on the picture is the local time at the camera, not yours.
