gdn: 1
id: nfl-record-book
version: 0.1.0
name: NFL Record Book
author: glance-led-dev
description: The NFL's all-time records and famous firsts, one a minute, drawn as an open record book - what the record is and who holds it on the left page, the big number on the right, their team's logo on the bookmark ribbon. Passing, rushing, receiving, defense, special teams, team records and oddities. No network needed.
category: Sports
entry: app.star

width: 192
height: 32
# 60 s: one record per minute. Nothing is fetched - the book is baked in.
refresh: 900

pages: [record]

# Team logos: 40 x 24 pixel art, named by ESPN abbreviation, plus the NFL
# shield as a fallback; vs-*.png are 24 x 18 opponents for head-to-head records
# (the 40 x 24 logo rides the bookmark ribbon).
assets:
  - ARI.png
  - ATL.png
  - BAL.png
  - BUF.png
  - CHI.png
  - CLE.png
  - DAL.png
  - DEN.png
  - DET.png
  - GB.png
  - IND.png
  - KC.png
  - LAC.png
  - LAR.png
  - LV.png
  - MIA.png
  - MIN.png
  - NE.png
  - NO.png
  - NYJ.png
  - PIT.png
  - SF.png
  - TEN.png
  - WSH.png
  - JAX.png
  - PHI.png
  - NFL.png
  - vs-ATL.png
  - vs-DAL.png
  - vs-DEN.png
  - vs-IND.png
  - vs-KC.png
  - vs-NYG.png
  - vs-NYJ.png
  - vs-WSH.png

inputs:
  - key: category
    type: choice
    app_input_type: dropdown
    label: Records
    default: "ALL"
    help: ALL rotates through the whole book. Pick a chapter, or a club to see its records and the famous games it played in.
    choices:
      - "ALL"
      - "PASSING"
      - "RUSHING"
      - "RECEIVING"
      - "DEFENSE"
