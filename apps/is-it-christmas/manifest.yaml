gdn: 1
id: is-it-christmas
version: 1.1.0
name: Is It Christmas?
author: Whit McGhee
description: Answers one question every day of the year. On December 25 the answer changes to YES and both trees light up.
category: Fun
entry: app.star

width: 64
height: 32
# The answer changes once a year, at local midnight. Hourly is the guideline
# cadence for daily data; no frames rotate, so nothing needs 60 s.
refresh: 3600

pages: [main]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    help: Pick the city nearest you. It decides when December 25 starts and ends where your panel hangs.
