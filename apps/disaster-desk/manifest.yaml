gdn: 1
id: disaster-desk
version: 0.1.0
name: Disaster Desk
author: John McRae
description: Latest official FEMA disaster declaration from OpenFEMA, nationally or by state. No API key required.
category: News
entry: app.star
width: 192
height: 32
# OpenFEMA refreshes about every 20 minutes. Half an hour is enough.
refresh: 1800
pages: [alert, incident, declared, aid]
inputs:
  - key: area
    type: string
    app_input_type: dropdown
    label: Area
    choices: ["ALL USA", "ALABAMA", "ALASKA", "ARIZONA", "ARKANSAS", "CALIFORNIA", "COLORADO", "CONNECTICUT", "DELAWARE", "DISTRICT OF COLUMBIA", "FLORIDA", "GEORGIA", "HAWAII", "IDAHO", "ILLINOIS", "INDIANA", "IOWA", "KANSAS", "KENTUCKY", "LOUISIANA", "MAINE", "MARYLAND", "MASSACHUSETTS", "MICHIGAN", "MINNESOTA", "MISSISSIPPI", "MISSOURI", "MONTANA", "NEBRASKA", "NEVADA", "NEW HAMPSHIRE", "NEW JERSEY", "NEW MEXICO", "NEW YORK", "NORTH CAROLINA", "NORTH DAKOTA", "OHIO", "OKLAHOMA", "OREGON", "PENNSYLVANIA", "RHODE ISLAND", "SOUTH CAROLINA", "SOUTH DAKOTA", "TENNESSEE", "TEXAS", "UTAH", "VERMONT", "VIRGINIA", "WASHINGTON", "WEST VIRGINIA", "WISCONSIN", "WYOMING", "AMERICAN SAMOA", "GUAM", "NORTHERN MARIANA ISLANDS", "PUERTO RICO", "VIRGIN ISLANDS"]
    default: ALL USA
    help: ALL USA shows the newest unique FEMA declaration nationally. A state or territory shows the newest unique declaration for that area.
  - key: incident
    type: string
    app_input_type: dropdown
    label: Incident
    choices: [ALL, FIRE, FLOOD, HURRICANE, SEVERE STORM, TORNADO, TROPICAL STORM, TYPHOON, WINTER STORM]
    default: ALL
    help: ALL uses the newest unique declaration. Other choices match OpenFEMA incidentType exactly (Hurricane is not Typhoon).
