gdn: 1
id: my-teams-board
version: 0.3.0
name: My Teams Board
author: joelfullyseeking
description: "Your teams, logo against logo: pick two NFL, two NBA, two NHL and two college football teams — or set a league's first team to None to switch that league off, and its pages become index pages for the teams still on. Each page shows the live score, the latest final, or the next game."
category: Sports
entry: app.star

width: 64
height: 32
refresh: 900

pages: [nfl1, nfl2, nba1, nba2, nhl1, nhl2, cfb1, cfb2]

