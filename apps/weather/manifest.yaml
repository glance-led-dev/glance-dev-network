id: weather
name: Weather Report
author: cfdmb
description: Estimated conditions and forecast for any US ZIP, no weather station or key needed. Bold color pages for the temperature and what's coming next, air quality, wind, rain, the day's temperature curve, the next 8 hours, 5 days ahead and the sun and moon, with NWS alerts.
category: Weather
width: 192
height: 32
refresh: 600
pages:
  - now
  - air
  - wind
  - rain
  - today
  - hourly
  - forecast
  - sky
inputs:
  - key: zip
    type: number
    app_input_type: number
    label: "ZIP"
    default: 27949
