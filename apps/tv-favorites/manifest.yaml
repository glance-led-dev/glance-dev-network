gdn: 1
id: tv-favorites
name: TV Favorites
description: Shows when your favorite live TV shows air today, tomorrow, and later, plus what to stream the next day. Checks your first 7 in-season favorites.
author: jkapera
width: 64
height: 32
refresh: 300
category: Entertainment
pages: [today, tomorrow, later, stream]
inputs:
  - key: configurl
    type: string
    app_input_type: free-text
    label: Config URL (no https://)
    default: ""
    help: "Host a JSON file with your channels and favorites list (GitHub raw works great) and paste the URL here, without https://"
  - key: utcoffset
    type: number
    app_input_type: free-text
    label: UTC Offset (hours)
    default: -6
    help: "Hours from UTC for your time zone. Mountain: -6 in summer (MDT), -7 in winter (MST). Update when clocks change."