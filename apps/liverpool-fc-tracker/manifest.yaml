gdn: 1
id: liverpool-fc-tracker
version: 0.3.0
name: "Soccer Club Tracker"
author: "Tim McCabe"
description: Follow any club in the world's top soccer leagues - live scores, the next fixture in your time zone, the last result, and where they sit in the table.
category: Sports
entry: app.star

width: 128
height: 32
refresh: 300

pages:
  - match
  - last_match
  - table

inputs:
  - key: league
    app_input_type: dropdown
    type: choice
    label: League
    default: premier_league
    choices:
      - premier_league
      - championship
      - la_liga
      - serie_a
      - bundesliga
      - ligue_1
      - eredivisie
      - primeira_liga
      - scottish_premiership
      - belgian_pro_league
      - super_lig
      - mls
      - liga_mx
      - brasileirao
      - argentina_primera
      - j1_league
      - a_league
      - womens_super_league
      - nwsl
    options:
      - premier_league
      - championship
      - la_liga
      - serie_a
      - bundesliga
      - ligue_1
      - eredivisie
      - primeira_liga
      - scottish_premiership
      - belgian_pro_league
      - super_lig
      - mls
      - liga_mx
      - brasileirao
      - argentina_primera
      - j1_league
      - a_league
      - womens_super_league
      - nwsl
    help: The league your club plays in. Its cup and European games show up too.
  - key: team
    app_input_type: free-text
    type: string
    label: Team
    default: Liverpool
    help: Club name or ESPN abbreviation, e.g. Liverpool, Real Madrid, Inter Miami or LIV.
  - key: timezone
    app_input_type: dropdown
    type: choice
    label: Time zone
    default: pacific
    choices:
      - pacific
      - mountain
      - central
      - eastern
      - alaska
      - hawaii
      - utc
      - uk
      - central_europe
      - eastern_europe
      - turkey
      - iceland
    options:
      - pacific
      - mountain
      - central
      - eastern
      - alaska
      - hawaii
      - utc
      - uk
      - central_europe
      - eastern_europe
      - turkey
      - iceland
    help: Kickoff times are shown in this zone, with daylight saving applied.
