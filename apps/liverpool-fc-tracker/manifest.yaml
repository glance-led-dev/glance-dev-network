gdn: 1
id: liverpool-fc-tracker
version: 0.2.1
name: "Liverpool FC Tracker"
author: "Tim McCabe"
description: Follow Liverpool FC live matches, upcoming fixtures, recent results, Premier League standings, and Champions League standings.
category: Sports
entry: app.star

width: 128
height: 32
refresh: 300

pages:
  - live_match
  - next_match
  - last_match
  - premier_league_table
  - champions_league_table

inputs:
  - key: timezone
    app_input_type: dropdown
    type: choice
    label: Time zone
    default: pacific
    choices:
      - pacific
      - mountain
      - central
      - eastern
      - alaska
      - hawaii
      - utc
      - uk
      - central_europe
      - eastern_europe
      - turkey
      - iceland
    help: Select your local time zone.

