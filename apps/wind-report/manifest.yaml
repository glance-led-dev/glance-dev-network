gdn: 1
id: wind-report
version: 0.1.0
name: Wind Report
author: glance-led-dev
description: Wind speed, gusts and direction — for sailors, cyclists and anyone with a kite.
category: Weather
entry: app.star

width: 64
height: 32
refresh: 900

pages: [wind]

assets:
  - WINDSOCK.png

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: US zip code. Sets the location.
  - key: units
    type: choice
    app_input_type: dropdown
    label: Units
    default: "IMPERIAL"
    choices: ["IMPERIAL", "METRIC"]
