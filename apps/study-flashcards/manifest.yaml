gdn: 1
id: study-flashcards
name: Study Flashcards
description: Cycles through term/definition flashcards from any JSON deck you host — build your own study set for any subject.
author: jkapera
width: 64
height: 32
pages: [subject, term, fullname]
refresh: 300
inputs:
  - key: deckurl
    type: string
    app_input_type: free-text
    label: Deck URL (no https://)
    default: ""
    help: 'Paste the address of a public JSON deck (a GitHub raw link works), without https://. Format: {"title": "...", "terms": [{"term": "...", "definition": "..."}]} — a bare list of terms works too, and "fullname" can stand in for "definition". Leave blank to see a demo deck. A new card shows every 5 minutes.'
