gdn: 1
id: pbr-bull-riding
version: 1.0.0
name: PBR Bull Riding
author: reyos86
description: Professional Bull Riders on your wall - countdown to the next event, every ride live with rider and bull scores, and the event leaderboard.
category: Sports
entry: app.star
width: 192
height: 32
refresh: 120
pages: [event, board]

inputs:
  - key: tour
    type: choice
    app_input_type: dropdown
    label: Tour
    default: "UNLEASH THE BEAST"
    choices: ["UNLEASH THE BEAST", "VELOCITY TOUR", "ALL TOURS"]
    options: ["UNLEASH THE BEAST", "VELOCITY TOUR", "ALL TOURS"]
    help: Unleash The Beast is PBR's top tour of the world's best 40 riders. Velocity Tour is the tour below it. All Tours follows every PBR event in the US.
