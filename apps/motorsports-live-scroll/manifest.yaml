# GDN app manifest (v2). This file is the source of truth for how your app is
# configured and reviewed. Edit it in VS Code or the Studio.
gdn: 1
id: motorsports-live-scroll
version: 0.1.0
name: Motorsports Live
author: jdhine02
description: Broadcast-style live leaderboard for NASCAR Cup, O'Reilly, Trucks, and Formula 1 — series logo, event info, flag state, lap and stage progress, and a rotating full-field board with car numbers, gaps to the leader, and playoff/chase status (NASCAR only). Between sessions, shows the next scheduled race — track, date, and time — in your local time zone.
category: Sports
entry: app.star

# Panel geometry. Height is 32 (fixed); width up to 384.
width: 192
height: 32

# One fixed interval for the whole app (no live-vs-not-live conditional
# refresh available) -- 2 minutes matches what's wanted while live; the
# next-race card just also checks every 2 minutes instead of 1 off-session.
refresh: 120

# Pages the panel rotates through, in order. app.star must define a function per name.
pages: [live]

