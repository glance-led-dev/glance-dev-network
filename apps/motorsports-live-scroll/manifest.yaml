# What the client fills in at install time.
#   type            — the data type: string | number | choice
#   app_input_type  — the UI widget the client sees. One of:
#                     free-text | dropdown | selection | checkbox | date | date-past | color
#                     (optional; if omitted the form infers it from `type`)
inputs:
  - key: series
    type: choice
    app_input_type: dropdown
    label: Series
    default: NASCAR
    choices: ["NASCAR", "NASCAR - O'Reilly", "NASCAR - Trucks", "Formula 1"]
    help: NASCAR Cup, the O'Reilly Auto Parts Series, the Craftsman Truck Series, or Formula 1.

  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    choices:
      - "America/New_York"
      - "America/Chicago"
      - "America/Denver"
      - "America/Phoenix"
      - "America/Los_Angeles"
      - "America/Anchorage"
      - "Pacific/Honolulu"
      - "America/Sao_Paulo"
      - "America/Mexico_City"
      - "Europe/London"
      - "Europe/Paris"
      - "Europe/Moscow"
      - "Africa/Johannesburg"
      - "Asia/Dubai"
      - "Asia/Kolkata"
      - "Asia/Shanghai"
      - "Asia/Tokyo"
      - "Asia/Singapore"
      - "Australia/Sydney"
      - "Pacific/Auckland"
    help: Used to show race dates and times in your local time -- F1's calendar spans every region, not just the US.

  - key: datecolor
    type: string
    app_input_type: color
    label: Next-race date/time color
    default: "#FFD166"
