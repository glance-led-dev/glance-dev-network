name: 10-Year Treasury Yield
author: Luan Celaj
description: The benchmark US 10-year Treasury yield with its 1-day, 1-week and 1-month moves in basis points, plus the 2Y-10Y spread (normal, flat or inverted). Keyless, from treasury.gov.
