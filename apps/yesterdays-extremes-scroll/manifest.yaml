gdn: 1
id: yesterdays-extremes-scroll
version: 0.1.0
name: Yesterday's Extremes
author: jeff
description: Yesterday's top three U.S. cities for heat, cold, rain or snow, shown as a gold, silver and bronze podium.
category: Weather
entry: app.star

width: 192
height: 32
refresh: 3600

pages: [gold, silver, bronze]

inputs:
  - key: metric
    type: choice
    app_input_type: dropdown
    label: Metric
    default: "Extreme High Temp"
    help: Which extreme to rank cities by. Snowfall covers the last 24 hours and is empty outside snow season.
    choices:
      - "Extreme High Temp"
      - "Extreme Low Temp"
      - "Extreme Rain"
      - "Extreme Snowfall"
