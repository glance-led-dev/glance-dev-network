gdn: 1
id: sportboards
version: 0.1.0
name: SportBoards
author: "SportBoards-TT"
description: Recent results, today's events, and upcoming events for a subscribing school's athletic department, from the SportBoards service.
category: Sports
entry: app.star
width: 384
height: 32

# 60s is the GDN minimum. It is how often Glance can ask for a fresh render,
# which is what lets successive appearances show different blocks of the
# feed. Data freshness is separate: app.star caches /board for 45s
# (TTL_SECONDS), and the backend keeps its own data current.
refresh: 300

# One 8-page block of the programmed feed per render (Community apps are
# limited to 8 pages). PAGE_COUNT in app.star must equal this list's length.
pages: [page1, page2, page3, page4, page5, page6, page7, page8]

inputs:
  - key: accesscode
    type: string
    app_input_type: api-key
    label: SportBoards access code
    default: ""
    required: true
    help: >-
      The access code SportBoards gave your athletic department (letters and
      numbers only). The code decides which school the board shows. Until a
      code is entered, the app plays a labelled DEMO with sample data.

