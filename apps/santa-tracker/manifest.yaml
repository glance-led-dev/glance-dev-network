gdn: 1
id: santa-tracker
version: 1.0.0
name: Santa Tracker
author: reyos86
description: Santa's sleigh on your wall - the countdown to takeoff, his Christmas Eve flight live city by city with presents delivered, and how long until he reaches where you live. Built for kids.
category: Lifestyle
entry: app.star
width: 192
height: 32
refresh: 300
pages: [sleigh, home, northpole]

inputs:
  - key: names
    type: string
    app_input_type: free-text
    label: Kids' names (or NONE)
    default: "NONE"
    help: Shown on the house page, for example EMMA or EMMA AND JACK. Leave as NONE for a general greeting.
  - key: home
    type: choice
    app_input_type: dropdown
    label: Where you live
    default: NONE
    choices: [NONE, ALABAMA, ALASKA, ARIZONA, ARKANSAS, CALIFORNIA, COLORADO, CONNECTICUT, DELAWARE, DISTRICT OF COLUMBIA, FLORIDA, GEORGIA, HAWAII, IDAHO, ILLINOIS, INDIANA, IOWA, KANSAS, KENTUCKY, LOUISIANA, MAINE, MARYLAND, MASSACHUSETTS, MICHIGAN, MINNESOTA, MISSISSIPPI, MISSOURI, MONTANA, NEBRASKA, NEVADA, NEW HAMPSHIRE, NEW JERSEY, NEW MEXICO, NEW YORK, NORTH CAROLINA, NORTH DAKOTA, OHIO, OKLAHOMA, OREGON, PENNSYLVANIA, RHODE ISLAND, SOUTH CAROLINA, SOUTH DAKOTA, TENNESSEE, TEXAS, UTAH, VERMONT, VIRGINIA, WASHINGTON, WEST VIRGINIA, WISCONSIN, WYOMING, ALBERTA, BRITISH COLUMBIA, MANITOBA, NEW BRUNSWICK, NEWFOUNDLAND AND LABRADOR, NORTHWEST TERRITORIES, NOVA SCOTIA, NUNAVUT, ONTARIO, PRINCE EDWARD ISLAND, QUEBEC, SASKATCHEWAN, YUKON]
