gdn: 1
id: nfl-team-leaders
version: 0.1.0
name: NFL Team Leaders
author: glance-led-dev
description: Your NFL team's season leaders - the passer, rusher and receiver with their yards as a giant number and the TDs behind them, plus the defense's tackle, sack and interception leaders. Club logo on every page. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# Leaders move once a week (after each game), so every 30 minutes is plenty.
# The ESPN leaders call is cached for the same 1800 s; athlete names for a day.
refresh: 1800

pages: [passing, rushing, receiving, defense]

# Team logos: the hand-tuned 40 x 24 pixel-art set, one per club, named by
# ESPN abbreviation.
assets:
  - ARI.png
  - ATL.png
  - BAL.png
  - BUF.png
  - CAR.png
  - CHI.png
  - CIN.png
  - CLE.png
  - DAL.png
  - DEN.png
  - DET.png
  - GB.png
