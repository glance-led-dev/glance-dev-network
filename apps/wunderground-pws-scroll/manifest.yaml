gdn: 1
id: wunderground-pws-scroll
version: 1.4.2
name: Weather Underground PWS
author: Brayden Slater
description: Personal Weather Station display with current conditions, wind, and rain data from Weather Underground
category: Weather
entry: app.star
width: 192
height: 32
refresh: 120
pages:
  - main
  - wind
  - rain
  - alerts
inputs:
  - key: temperatureunit
    type: choice
    app_input_type: dropdown
    label: Temperature Unit
    choices: [Fahrenheit (English / Imperial), Celsius (Metric)]
    default: Fahrenheit (English / Imperial)
  - key: apikey
    label: Weather Underground API Key
    type: api-key
    app_input_type: api-key
    default: ""
    help: "Get this from your WU Account → My Devices → API Keys Tab (wunderground.com/member/api-keys)" 
  - key: stationid
    label: PWS Station ID
    type: string
    pp_input_type: free-text
    default: ""
    help: "Your Weather Underground station ID"
  - key: location
    label: City Label (Optional)
    type: string
    app_input_type: optional-free-text
    default: ""
    help: "Custom name shown on the display (e.g. Home)"
  
