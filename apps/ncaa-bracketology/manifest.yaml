gdn: 1
id: ncaa-bracketology
version: 0.3.1
name: NCAA Bracketology
author: Jacob Wilmot
description: Somelofske Sports' approved 76-team bracketology projection, team matchups, bubble watch and multi-bid conferences.
category: Sports
entry: app.star
width: 192
height: 32
refresh: 3600
pages: [intro, east1, midwest1, west1, south1]
inputs:
  - key: view
    type: choice
    app_input_type: dropdown
    label: Bracketology view
    default: My Team
    choices: [Field of 64, Top 4 Seeds, My Team, Bubble, Opening Round]
    help: Each view includes the intro and four content screens. UPDATED is the approved projection date; SAVED identifies the bundled approved bracket used when the feed is unavailable. Missing or prior-season metrics display as dashes.
