gdn: 1
id: ncaaf-rivalry-tracker
version: 1.0.0
name: NCAAF Rivalry Tracker
author: Brayden Slater
description: Head-to-head series for any two college football teams (Winsipedia-style). Titles and abbreviations load from a remote JSON so you can update them without changing code. Defaults to Red River.
category: Sports
entry: app.star
width: 192
height: 32
refresh: 86400
pages: [main]
inputs:
  - key: apikey
    required: true
    type: string
    app_input_type: api-key
    label: CFBD API Key
    help: Free key from collegefootballdata.com
  - key: team1
    type: string
    app_input_type: free-text
    label: Team 1
    default: "Oklahoma"
  - key: team2
    type: string
    app_input_type: free-text
    label: Team 2
    default: "Texas"
  - key: customtitle
    type: string
    app_input_type: free-text
    label: Optional Custom Title
    default: ""
    help: Overrides automatic rivalry title detection if provided.
  - key: teamnamelength
    type: choice
    app_input_type: dropdown
    label: Team Name Length
    choices: [Abbreviations, Full Name]
    default: Abbreviations