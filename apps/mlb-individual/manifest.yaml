      - "PHI"
      - "PIT"
      - "SD"
      - "SF"
      - "SEA"
      - "STL"
      - "TB"
      - "TEX"
      - "TOR"
      - "WSH"
    help: Which team to follow.
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    help: Pick the city nearest you. Daylight saving is applied automatically, so this never needs changing twice a year.
