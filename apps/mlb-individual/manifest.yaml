gdn: 1
id: mlb-individual
version: 0.1.0
name: MLB Scores
author: dsavitsky
description: Live, final, and upcoming games for one MLB team, with team-coloured score panels, base runners, and the ball-strike-out count.
category: Sports
entry: app.star

width: 64
height: 32

refresh: 300

pages: [count, players]

inputs:
  - key: team
    type: choice
    app_input_type: dropdown
    label: Team
    default: "NYY"
    choices:
      - "ARI"
      - "ATH"
      - "ATL"
      - "BAL"
      - "BOS"
      - "CHC"
      - "CHW"
      - "CIN"
