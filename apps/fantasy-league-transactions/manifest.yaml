gdn: 1
id: fantasy-league-transactions
version: 0.1.0
name: League Transaction Wire
author: glance-led-dev
description: Your ESPN or Sleeper fantasy league's waiver wire, newest first - claims with their FAAB bids, free-agent adds and drops, and trades - with each fantasy team's crest and each player's NFL logo. Your own team's moves are marked in gold, with your FAAB left and the bids that beat yours.
category: Sports
entry: app.star

width: 192
height: 32
# 600 s: the league ID and team are free text (the under-5-minute rule
# allows only dropdown / checkbox / selection inputs), and a league's
# wire moves a few times a day.
refresh: 600

pages: [latest, wire]

