gdn: 1
version: 0.2.0
id: norms-lounge
name: Sunset Game Day Board
author: Red Tail Land Co.
description: Game day board header for your bar or watch party - your venue's name over a sunset, palms, and this week's dates.
category: Sports
entry: app.star
width: 192
height: 32
refresh: 3600
pages: [title, board, kickoff]
inputs:
  - key: venue
    app_input_type: free-text
    type: string
    label: Venue name
    default: "THE LOUNGE"
    help: Your bar, team, or watch party name, shown big on the first page. Short names draw largest.
  - key: weekstart
    type: choice
    app_input_type: dropdown
    label: Week runs
    default: "TUE-MON"
    choices: ["TUE-MON", "MON-SUN", "SUN-SAT"]
    help: Which days the dates on the Game Day Board cover. TUE-MON keeps Monday night football in the week.
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone, so the week flips at your local midnight. Daylight saving is applied automatically.
