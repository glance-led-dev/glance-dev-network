gdn: 1
id: nfl-playoff-picture
version: 0.1.0
name: NFL Playoff Picture
author: glance-led-dev
description: If the season ended today - one conference's seven playoff seeds drawn as the wild-card bracket (1 on a bye, 2 v 7, 3 v 6, 4 v 5) with logos and records, plus the teams in the hunt for the last spot and how many games back they are. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# Standings change once a week at most; the ESPN call is cached for the same
# 1800 s.
refresh: 43200

pages: [bracket, hunt]

# Club logos at two authored sizes: S/ 24 x 18 for the seven-team bracket,
# L/ 40 x 24 (hand-tuned) for the three-team hunt page.
