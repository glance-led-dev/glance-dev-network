gdn: 1
id: hex-clock-scroll
version: 0.1.0
name: Hex Clock
author: glance-led-dev
description: The time read as a hex colour — the panel becomes that colour, all day long.
category: Time
entry: app.star

width: 192
height: 32
refresh: 60

pages: [hex, channels]

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: US zip code. Sets your timezone, daylight saving included.
