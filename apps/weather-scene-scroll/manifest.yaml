gdn: 1
id: weather-scene-scroll
version: 0.1.0
name: Weather
author: glance-led-dev
description: Now and the next three days, told by drawn weather art rather than words.
category: Weather
entry: app.star

width: 192
height: 32
refresh: 1800

pages: [now, forecast]

assets:
  - SUN.png
  - CLOUD.png
  - PARTLY.png
  - RAIN.png
  - SNOW.png
  - STORM.png
  - FOG.png
  # Black silhouettes of the seven drawings above, derived from their own
  # alpha channels. sprite_at() stamps one at each of the eight neighbouring
  # offsets to give the art a 1px keyline against the sky.
  - SUN_KEY.png
  - CLOUD_KEY.png
  - PARTLY_KEY.png
  - RAIN_KEY.png
  - SNOW_KEY.png
  - STORM_KEY.png
  - FOG_KEY.png

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: US zip code. Sets your timezone, daylight saving included.
