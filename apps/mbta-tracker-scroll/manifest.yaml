gdn: 1
id: mbta-tracker-scroll
version: 0.1.0
name: "MBTA Tracker (Boston)"
author: "gabetrainor"
description: Live upcoming-train countdown board for any MBTA subway or commuter rail station.
category: Transportation
entry: app.star

# Panel geometry. Height is 32 (fixed); width up to 384.
width: 192
height: 32

# 60 is the minimum refresh for a public app; http.get's own ttl_seconds=20 in
# app.star keeps a live-editing Studio session fresher than that without
# hammering the (unauthenticated, rate-limited) MBTA API on every panel.
refresh: 120

pages: [main]

inputs:
  - key: station
    type: choice
    app_input_type: dropdown
    label: Station
    default: "Park Street (Red Line)"
    help: >-
      Stations served by both a subway line and the Commuter Rail (Back Bay,
      Braintree, Forest Hills, JFK/UMass, Malden Center, North Station, Oak
      Grove, Porter, Quincy Center, Ruggles, South Station) appear once per
      mode, e.g. "Back Bay (Orange Line)" and "Back Bay (CR)". Stations served
      by two subway lines (Park Street, Downtown Crossing, Ashmont, State,
      Haymarket, North Station, Government Center) appear once per line, e.g.
      "Park Street (Red Line)" and "Park Street (Green Line)".
