inputs:
  - key: position
    type: choice
    app_input_type: dropdown
    label: Position
    default: "ALL"
    help: ALL rotates through QB, RB, WR, TE, K and DEF, showing the top 3 at each. Pick one position to walk its top 10.
    choices:
      - "ALL"
      - "QB"
      - "RB"
      - "WR"
      - "TE"
      - "K"
      - "DEF"
    options:
      - "ALL"
      - "QB"
      - "RB"
      - "WR"
      - "TE"
      - "K"
      - "DEF"
  - key: scoring
    type: choice
    app_input_type: dropdown
    label: Scoring
    default: "PPR"
    help: The league scoring the projected points and the ranking use.
    choices:
      - "PPR"
      - "HALF PPR"
      - "STANDARD"
    options:
      - "PPR"
      - "HALF PPR"
      - "STANDARD"
