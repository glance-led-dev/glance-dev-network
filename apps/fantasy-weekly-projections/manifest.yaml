gdn: 1
id: fantasy-weekly-projections
version: 0.1.0
name: Fantasy Weekly Projections
author: glance-led-dev
description: This week's top projected fantasy players by position - projected points against their season average, the stat line behind them, a STUD / START / FLEX tier, injury tags, and the matchup (home or away, game day) in team logos. Finished games show the final score. PPR, half PPR or standard. From Sleeper, no key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 120 s: each refresh shows the next player on the board (one rank per
# frame). Projections and the Sleeper week are cached for an hour, season
# stats for six hours and the schedule and week stats for 30 minutes.
refresh: 120

pages: [board]

# Team logos: the 40 x 24 hero set (<abbr>.png, plus NFL.png) and the
# 24 x 18 list set (<abbr>_S.png) for the opponent.
assets:
  - ARI.png
  - ARI_S.png
  - ATL.png
  - ATL_S.png
