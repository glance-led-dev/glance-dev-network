id: nfl-offensive-leaders
name: NFL Offensive Leaders
author: cfdmb
description: Top 3 offensive leaders by category, for NFL, AFC, or NFC - regular season or playoffs.
category: Sports
width: 192
height: 32
refresh: 10800
pages:
  - passyds
  - passtd
  - passrtg
  - rushyds
  - rushtd
  - rec
  - recyds
  - rectd
inputs:
  - key: league
    type: string
    app_input_type: dropdown
    label: League
    choices: [NFL, AFC, NFC]
    default: NFL
  - key: stats
    type: string
    app_input_type: dropdown
    label: Stats
    choices: [Regular season, Playoffs]
    default: Regular season
    help: "Playoffs shows the latest postseason. Passer rating needs 14 attempts per team game."
