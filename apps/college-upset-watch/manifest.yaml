inputs:
  - key: size
    type: choice
    app_input_type: dropdown
    label: Upsets to show
    default: "ALL UPSETS"
    help: Ranked means the AP Top 25, then the CFP Top 25 once it is out. ALL UPSETS shows every ranked team that lost to an unranked or lower-ranked opponent. BIG UPSETS ONLY keeps the winners who were 7+ point underdogs (or an unranked team over the top 10 when no line is on record).
    choices:
      - "ALL UPSETS"
      - "BIG UPSETS ONLY"
    options:
      - "ALL UPSETS"
      - "BIG UPSETS ONLY"
  - key: school
    type: choice
    app_input_type: dropdown
