gdn: 1
id: college-upset-watch
version: 0.1.0
name: College Upset Watch
author: glance-led-dev
description: The week's biggest college football upsets - the underdog's logo beside the ranked team it knocked off, split by a lightning strike, with the final score, the point spread and moneyline it overcame - plus how many ranked teams fell. Finals only, FBS, no key needed.
category: Sports
entry: app.star

width: 192
height: 32
# 300 s: one upset per 5-minute frame. The current week's scoreboard is
# cached 10 minutes, a past week's 6 hours, and a final's closing line a day.
refresh: 7200

pages: [upsets, carnage]

# FBS logos: L/ is the 40 x 24 hero size, S/ the 24 x 18 list size, named by
# ESPN abbreviation (Texas A&M is TAM - an & is not allowed in an asset name).
