gdn: 1
id: birthdays
version: 0.1.0
name: Upcoming Birthdays
author: community
description: The next few birthdays, with a Today highlight and a countdown. First name, date, and the age they are turning — nothing else.
category: Lifestyle
entry: app.star
width: 128
height: 32
refresh: 3600
pages: [next, soon]
inputs:
  - key: entries
    type: string
    app_input_type: free-text
    label: Birthday list
    default: ""
    help: >-
      One person per line, or separated by semicolons. First name only,
      then date, then birth year: Alex,12/03,1996; Sam,01/15,2018.
      Do not use colons (Glance cuts the value at a colon). Leave blank
      to preview demo names.
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    help: Used to decide "today" and the day countdown. Daylight saving is applied automatically.
    choices:
      - "Pacific/Honolulu"
      - "America/Anchorage"
      - "America/Los_Angeles"
      - "America/Phoenix"
      - "America/Denver"
      - "America/Chicago"
      - "America/New_York"
      - "UTC"
  - key: rows
    type: choice
    app_input_type: dropdown
    label: Names on the list page
    default: "4"
    choices: ["3", "4", "5"]
    help: How many upcoming birthdays to show on the list page. 4 is the most that fits this 32-pixel panel with a gap between rows; a 5th is counted as +N in the header. The next page always focuses on the soonest birthday.
