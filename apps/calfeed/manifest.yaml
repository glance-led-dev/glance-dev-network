gdn: 1
id: calfeed
version: 0.2.0
name: Calfeed Agenda
author: cfsmp3
description: Your next calendar event from a calfeed feed - merged calendars, one private URL, no sign-in on the panel.
category: Lifestyle
entry: app.star

# 64x32 (LED V2). The same app.star lays itself out for 128+ (SCROLL).
width: 64
height: 32

# The feed is cached 60 s upstream, but publishing rules require 300 for
# apps with free-text or color inputs. The main fetch's ttl stays 60.
refresh: 300

pages: [now, next]

inputs:
  - key: label
    type: string
    app_input_type: free-text
    label: Label
    default: ""
    help: Shown on every page, e.g. a name when two instances show two people's calendars. Blank uses the view's name.
  - key: labelcolor
    type: choice
    app_input_type: dropdown
    label: Label color
    default: gray
    choices: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    options: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    help: Colors the label, so two instances read apart at a glance.
  - key: farcolor
    type: choice
    app_input_type: dropdown
    label: Far-off color
    default: white
    choices: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    options: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    help: Hero colour for an event more than 15 minutes away.
  - key: sooncolor
    type: choice
    app_input_type: dropdown
    label: Soon color
    default: amber
    choices: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    options: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    help: Hero colour for an event starting within 15 minutes.
  - key: runningcolor
    type: choice
    app_input_type: dropdown
    label: Running color
    default: green
    choices: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    options: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    help: Hero colour for an event in progress, and its progress bar.
  - key: alldaycolor
    type: choice
    app_input_type: dropdown
    label: All-day color
    default: skyblue
    choices: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    options: [gray, white, red, orange, amber, green, skyblue, purple, pink]
    help: Hero colour for an all-day event.
  - key: feedid
    type: string
    app_input_type: api-key
    label: Feed ID
    default: ""
    help: The hex id at the end of your calfeed feed URL (https://calfeed.io/v1/feed/<this part>). Leave blank for demo data.
  - key: feedkey
    type: string
    app_input_type: api-key
    label: Feed header (optional)
    default: ""
    help: Only if the feed requires a header, as Name=value (e.g. X-Feed-Key=secret123). It must contain no colon.
