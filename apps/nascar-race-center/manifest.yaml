id: nascar-race-center
name: NASCAR Race Center
author: cfdmb
description: Cup, O'Reilly or Truck Series built around each car's real number art - a race card (live flag, lap, stage and leader; the winner and margin; qualifying and the pole; or the next race in your time zone), the full field 8 cars a page (or just the top 20, the top 10 with big numbers, or the Chase drivers) with gaps to the thousandth, pit stops and tire calls, and live Chase points. Season leaders on off days.
category: Sports
width: 192
height: 32
refresh: 300
pages:
  - card
  - field1
  - field2
  - field3
  - field4
  - field5
  - chase1
  - chase2
inputs:
  - key: series
    type: string
    app_input_type: dropdown
    label: Series
    choices: [Cup Series, O'Reilly Series, Truck Series]
    default: Cup Series
  - key: timezone
    type: string
    app_input_type: dropdown
    label: Time zone
    choices: [Eastern, Central, Mountain, Arizona, Pacific, Alaska, Hawaii]
    default: Eastern
    help: For race and qualifying start times.
  - key: field
    type: string
    app_input_type: dropdown
    label: Running order
    choices: [Full field, Top 20, Top 10, Chase drivers]
    default: Full field
    help: Top 20 and Chase drivers show 4 cars a page with names, laps led and spots gained; Top 10 shows 2 cars a page with big numbers.
