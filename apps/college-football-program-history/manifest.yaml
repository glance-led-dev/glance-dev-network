gdn: 1
id: college-football-program-history
version: 0.1.0
name: College Football Program History
author: glance-led-dev
description: The trophy case and history of 39 major college football programs - claimed national titles, Heisman winners, conference and stadium, and a rotating story of the players, coaches, titles and rivalries, with the rival's logo facing off. No network needed.
category: Sports
entry: app.star

width: 192
height: 32
# 60 s because the tradition page shows a new story each minute. Nothing is
# fetched - the data is baked into app.star.
refresh: 60

pages: [legacy, tradition]

# School logos, 40 x 24 pixel art on transparent, by ESPN abbreviation
# (Texas A&M ships as TAMU.png - an & in a file name is asking for trouble).
assets:
  - ALA.png
  - AUB.png
  - UGA.png
  - FLA.png
  - LSU.png
  - TENN.png
  - TEX.png
  - OU.png
