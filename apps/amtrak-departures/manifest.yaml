id: amtrak-departures
name: Amtrak Departures
description: Next trains leaving any US Amtrak station, with live delays.
author: 'uel'
width: 64
height: 32
refresh: 300
pages:
  - title
  - next_train
  - board1
  - board2
inputs:
  - key: station
    name: Station
    app_input_type: dropdown
    default: NYP
    options:
      - {value: NYP, label: "NYP - New York Penn"}
      - {value: WAS, label: "WAS - Washington Union"}
      - {value: BOS, label: "BOS - Boston South"}
      - {value: BBY, label: "BBY - Boston Back Bay"}
      - {value: PHL, label: "PHL - Philadelphia 30th St"}
      - {value: BAL, label: "BAL - Baltimore Penn"}
      - {value: BWI, label: "BWI - BWI Airport"}
      - {value: WIL, label: "WIL - Wilmington DE"}
      - {value: NWK, label: "NWK - Newark Penn"}
      - {value: TRE, label: "TRE - Trenton"}
      - {value: HAR, label: "HAR - Harrisburg"}
      - {value: PVD, label: "PVD - Providence"}
      - {value: NHV, label: "NHV - New Haven"}
      - {value: ALB, label: "ALB - Albany Rensselaer"}
      - {value: SYR, label: "SYR - Syracuse"}
      - {value: ROC, label: "ROC - Rochester NY"}
      - {value: BUF, label: "BUF - Buffalo DEpew"}
