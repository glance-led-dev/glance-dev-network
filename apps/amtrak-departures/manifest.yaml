      - {value: SLC, label: "SLC - Salt Lake City"}
      - {value: SEA, label: "SEA - Seattle"}
      - {value: PDX, label: "PDX - Portland OR"}
      - {value: SAC, label: "SAC - Sacramento"}
      - {value: EMY, label: "EMY - Emeryville"}
      - {value: LAX, label: "LAX - Los Angeles"}
      - {value: SAN, label: "SAN - San Diego"}
      - {value: SBA, label: "SBA - Santa Barbara"}
      - {value: SJC, label: "SJC - San Jose"}
      - {value: ABQ, label: "ABQ - Albuquerque"}
