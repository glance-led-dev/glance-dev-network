      - {value: SAV, label: "SAV - Savannah"}
      - {value: JAX, label: "JAX - Jacksonville"}
      - {value: ORL, label: "ORL - Orlando"}
      - {value: TPA, label: "TPA - Tampa"}
      - {value: MIA, label: "MIA - Miami"}
      - {value: NOL, label: "NOL - New ORleans"}
      - {value: ATL, label: "ATL - Atlanta Peachtree"}
      - {value: CHS, label: "CHS - Charleston SC"}
      - {value: CHI, label: "CHI - Chicago Union"}
      - {value: MKE, label: "MKE - Milwaukee"}
      - {value: STL, label: "STL - St Louis"}
      - {value: KCY, label: "KCY - Kansas City"}
      - {value: DET, label: "DET - Detroit"}
      - {value: PIT, label: "PIT - Pittsburgh"}
      - {value: CLE, label: "CLE - Cleveland"}
      - {value: CIN, label: "CIN - Cincinnati"}
      - {value: IND, label: "IND - Indianapolis"}
