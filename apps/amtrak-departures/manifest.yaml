  - key: customcode
    name: Other station code (optional, overrides list)
    app_input_type: free-text
    default: ""
  - key: rows
    name: Trains shown
    app_input_type: dropdown
    default: "4"
    options:
      - {value: "2", label: "2 trains"}
      - {value: "4", label: "4 trains"}
  - key: demo
    name: Demo mode (sample trains)
    app_input_type: checkbox
    default: false
