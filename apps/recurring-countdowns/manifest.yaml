id: recurring-countdowns
name: Recurring Countdowns
description: Count down the number of days until a special date (up to 6).
author: Matt H.
width: 64
height: 32
refresh: 21600
pages:
  - event1
  - event2
  - event3
  - event4
  - event5
  - event6
assets:
  - anniv.png
  - bday.png
  - trophy.png
  - trip.png
inputs:

# ---------------
# --- EVENT 1 ---
# ---------------
  - key: event1
    name: Event 1 Type
    app_input_type: dropdown
    default: "ANNIV"
    options:
      - label: "Birthday"
        value: "BDAY"
      - label: "Anniversary"
        value: "ANNIV"
      - label: "Milestone"
        value: "EVENT"
      - label: "Trip"
        value: "TRIP"
      - label: "None / Off"
        value: "NONE"
  - key: name1
    name: Event 1 Name
    app_input_type: free-text
    default: "Our"
  - key: month1
    name: Event 1 Month
    app_input_type: dropdown
    default: "2"
    options: [{"label": "Jan", "value": "1"}, {"label": "Feb", "value": "2"}, {"label": "Mar", "value": "3"}, {"label": "Apr", "value": "4"}, {"label": "May", "value": "5"}, {"label": "Jun", "value": "6"}, {"label": "Jul", "value": "7"}, {"label": "Aug", "value": "8"}, {"label": "Sep", "value": "9"}, {"label": "Oct", "value": "10"}, {"label": "Nov", "value": "11"}, {"label": "Dec", "value": "12"}]
  - key: day1
    name: Event 1 Day
    app_input_type: dropdown
    default: "4"
    options: [{"label": "4", "value": "4"}, {"label": "14", "value": "14"}, {"label": "28", "value": "28"}, {"label": "30", "value": "30"}]

