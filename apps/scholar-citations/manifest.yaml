gdn: 1
id: scholar-citations
version: 0.1.0
name: Scholar Citations
author: ShulinZhou
description: Show researcher's Google Scholar profile. Enter your own SerpApi key and Scholar profile ID (replace all underscore with dot).
category: Education
entry: app.star

width: 192
height: 32

# Re-render hourly so the date in the top-right turns over on time. The
# SerpApi fetch is cached for a day (TTL in app.star), so it is still one
# search a day on the viewer's own key: about 30 a month per profile, well
# inside the free plan's 250.
refresh: 3600

pages:
  - profile

inputs:
  - key: apikey
    type: string
    app_input_type: api-key
    label: SerpApi API key
    default: ""
    help: Free at serpapi.com (250 searches a month; this app uses about 30). Leave blank to see a demo profile. See this app's README.

  - key: scholarid
    type: string
    app_input_type: free-text
    label: Google Scholar profile ID
    default: ""
    help: The user= part of the profile address, like tyJLhv4AAAAJ - not the whole link. Type each underscore in the ID as a dot (_Ab-Cd_EAAAJ becomes .Ab-Cd.EAAAJ); the panel can't carry underscores. Dashes are fine as they are.

  - key: color
    type: choice
    app_input_type: dropdown
    label: Highlight color
    default: Blue
    help: Colors this year's bar, this year's citation count and the pill behind today's date.
    choices: [Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White]
