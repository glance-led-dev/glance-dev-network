id: iss-sighting
name: ISS Next Sighting
category: Science
author: cfdmb
description: When and where to look up for the next naked-eye-visible passes of the International Space Station over your zip code, with a sky map of each pass. The badge rates how bright each pass will look, from DAZZLING (as bright as Venus) down to DIM.
width: 192
height: 32
refresh: 3600
pages:
  - intro
  - sighting
  - path
  - sighting2
  - path2
  - sighting3
  - path3
  - crew
inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: ""
    help: A US zip code - used to look up your latitude/longitude.
  - key: apikey
    required: true
    type: string
    app_input_type: api-key
    label: N2YO API key
    help: Free key from n2yo.com - sign up, then Account > API Key.
