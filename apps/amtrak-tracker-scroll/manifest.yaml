gdn: 1
id: amtrak-tracker-scroll
version: 0.1.0
name: Amtrak Tracker (Scroll)
author: glance-led-dev
description: "Where your Amtrak train actually is, how late it is, and its next stop."
category: Transportation
entry: app.star

width: 192
height: 32
refresh: 300

pages: [train]

assets:
  - LOCO.png

inputs:
  - key: number
    type: string
    app_input_type: free-text
    label: Train number
    default: "173"
    help: "Amtrak train number, e.g. 173 for a Northeast Regional."
