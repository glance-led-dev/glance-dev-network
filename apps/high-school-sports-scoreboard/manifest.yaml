inputs:
  - key: sport
    app_input_type: dropdown
    type: choice
    label: Choose a sport
    default: Football
    choices: [Football, Boys Basketball, Girls Basketball, Baseball, Softball, Girls Volleyball, Boys Soccer, Girls Soccer]
    help: Select the sport to display.
  - key: maxprepsurl
    required: true
    app_input_type: free-text
    type: string
    label: MaxPreps school URL
    help: Required. Paste the main school page, not a game URL.
  - key: parsekey
    required: true
    app_input_type: api-key
    type: string
    label: Parse API key
    help: "Required. Subscribe to the MaxPreps API at https://parse.bot/marketplace/1d510b08-d5bf-481d-aa00-82f8b510e6dd/maxpreps-com-api"
  - key: gamechangerteamid
    app_input_type: free-text
    type: string
    label: GameChanger Team ID (Optional)
    default: ""
    help: Optional for baseball and softball.
  - key: displaytimezone
    app_input_type: dropdown
    type: choice
    label: Display time zone
    default: Eastern
    choices: [Eastern, Central, Mountain, Pacific, Arizona, Alaska, Hawaii]
    help: Time zone shown on your display.
  - key: livefrequency
    app_input_type: dropdown
    type: choice
    label: Live update frequency
    default: Every 30 minutes (2 credits/hour)
    choices: [No live pulls (0 credits/hour), Every 5 minutes (12 credits/hour), Every 10 minutes (6 credits/hour), Every 15 minutes (4 credits/hour), Every 20 minutes (3 credits/hour), Every 30 minutes (2 credits/hour)]
    help: Disable live pulls or choose how often live scores update.
