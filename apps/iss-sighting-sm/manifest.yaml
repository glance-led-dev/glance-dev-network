id: iss-sighting-sm
name: ISS Next Sighting (Small)
author: cfdmb
description: When and where to look up for the next naked-eye-visible pass of the International Space Station over your zip code - 64x32 edition.
width: 64
height: 32
refresh: 1800
pages:
  - intro
  - sighting
  - sky
  - path
inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: ""
    help: A US zip code - used to look up your latitude/longitude.
  - key: apikey
    required: true
    type: string
    app_input_type: api-key
    label: N2YO API key
    help: Free key from n2yo.com - sign up, then Account > API Key.
