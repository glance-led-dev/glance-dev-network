  - key: numcolor
    type: choice
    app_input_type: dropdown
    label: Event color
    default: Pink
    choices: [Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White]
    help: The colour of the event's name and day count.

  - key: accent
    type: choice
    app_input_type: dropdown
    label: Accent color
    default: Purple
    choices: [Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White]
    help: The edge rail.
