inputs:
  - key: event
    type: string
    app_input_type: free-text
    label: Event name
    default: "WEDDING"
    help: "Completes the title: DAYS SINCE ___. Leave blank to use the theme name."
  - key: date
    type: string
    app_input_type: date-past
    label: Event date
    default: "2012-08-05"
    help: The day it happened - today or earlier. Counts DAYS SINCE it, and shows TODAY on the day.
  - key: theme
    type: choice
    app_input_type: dropdown
    label: Event theme
    default: Wedding
    choices:
      - Wedding
      - Birthday
      - Graduation
      - House
      - Car
      - Bicycle
      - Yacht
      - Departure
      - Arrival
      - Tree
      - Flower
