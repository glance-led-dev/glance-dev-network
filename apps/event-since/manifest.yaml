gdn: 1
id: event-since
version: 0.1.0
name: Event Since
author: ShulinZhou
description: Days since your wedding, birthday, graduation or other milestone, with themed pixel art and a count colour you choose.
category: Lifestyle
entry: app.star

width: 192
height: 32
refresh: 21600

