id: sxm-now-playing
name: SiriusXM Now Playing
author: cfdmb
category: Entertainment
description: What's playing right now on four SiriusXM channels - yours, or a genre's - via xmplaylist.com.
width: 192
height: 32
# Note for the GDN crew: songs change every few minutes, so 300 keeps
# "now playing" current. Each refresh makes at most 8 requests (4 song
# lookups + 4 covers); covers are cached for a week.
refresh: 300
pages:
  - intro
  - channel_1
  - channel_2
  - channel_3
  - channel_4
inputs:
  - key: genre
    type: string
    app_input_type: dropdown
    label: Stations
    default: My Channels
    choices: [My Channels, Rock, Pop, Hip-Hop & R&B, Country, Jazz & Standards, Dance & Electronic, Latin & World, Canadian, Comedy, Christian, Kids]
    help: My Channels uses the four channel boxes below; a genre shows four of its stations, a new four each hour.
  - key: mychannel1
    type: string
    app_input_type: free-text
    label: My Channel 1
    default: "30"
    help: A SiriusXM channel number. Type NONE to skip this slot.
  - key: mychannel2
    type: string
    app_input_type: free-text
    label: My Channel 2
    default: "23"
    help: A SiriusXM channel number. Type NONE to skip this slot.
  - key: mychannel3
    type: string
    app_input_type: free-text
    label: My Channel 3
    default: "33"
    help: A SiriusXM channel number. Type NONE to skip this slot.
  - key: mychannel4
    type: string
    app_input_type: free-text
    label: My Channel 4
    default: "18"
    help: A SiriusXM channel number. Type NONE to skip this slot.
