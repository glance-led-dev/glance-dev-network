gdn: 1
id: night-board
version: 0.1.0
name: Night Board
author: joelfullyseeking
description: "A calm board for the night hours — the time, a verse for the day, and the sober day count, drawn dim after bedtime and full-strength by day."
category: Lifestyle
entry: app.star

width: 64
height: 32
refresh: 60

pages: [clock, verse, counter]

inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: US time zone. Daylight saving is applied automatically.
  - key: nightstart
    type: choice
    app_input_type: dropdown
    label: Dim from
    default: "2230"
    help: When the board drops to night brightness (24-hour HHMM).
    choices: ["2100", "2130", "2200", "2230", "2300", "2330"]
  - key: nightend
    type: choice
    app_input_type: dropdown
    label: Bright again from
    default: "0745"
    help: When the board returns to full brightness (24-hour HHMM).
    choices: ["0600", "0630", "0700", "0730", "0745", "0800", "0830"]
  - key: nightpct
    type: choice
    app_input_type: dropdown
    label: Night brightness
    default: "25"
    help: Percent of full brightness drawn during the night window.
    choices: ["15", "20", "25", "30", "40"]
  - key: since
    type: string
    app_input_type: date-past
    label: Sobriety date
    default: "2025-08-29"
    help: The day the streak began, for the counter page.
  - key: accent
    type: string
    app_input_type: color
    label: Accent color
    default: "#E8B33A"
