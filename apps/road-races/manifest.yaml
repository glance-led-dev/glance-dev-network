gdn: 1
id: road-races
version: 0.1.0
name: "Road Races"
author: "drb116"
description: Display a user's next three road races. Create a Cloudflare worker API from the RunSignup API to return the races from your account and enter the details here.
category: Lifestyle
entry: app.star
width: 64
height: 32
refresh: 86400

pages:
  - race1
  - race2
  - race3

inputs:
  - key: workerurl
    type: string
    app_input_type: free-text
    label: Worker API URL
    default: "https://YOUR-WORKER.workers.dev/api/races"

  - key: apptoken
    required: true
    type: string
    app_input_type: api-key
    label: Worker App Token
    default: ""