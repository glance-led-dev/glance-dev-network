gdn: 1
id: event-reminder
version: 0.1.0
name: Event Reminder
author: ShulinZhou
description: Days until the next time a recurring thing happens - every day, every few days, weekly, monthly or yearly - with themed pixel art and a count colour of your choice.
category: Lifestyle
entry: app.star

width: 192
height: 32
refresh: 60

pages: [reminder]

inputs:
  - key: title1
    type: string
    app_input_type: free-text
    label: Title
    default: "SOCCER"
    help: "Completes the title: DAYS TO ___. Leave blank to use the icon name."
  - key: date1
    type: string
    app_input_type: date
    label: First date
    default: "2026-09-12"
    help: The first time it happens. The schedule counts from here.
  - key: repeat1
    type: string
    app_input_type: dropdown
    label: How often
    default: Weekly
    help: How often it happens. The panel counts down to the next one.
    choices:
      - "Every day"
      - "Every 2 days"
      - "Every 3 days"
      - "Every 4 days"
      - Weekly
      - "Every 2 weeks"
      - Monthly
      - Quarterly
      - "Semi-yearly"
      - Yearly
  - key: theme1
    type: string
    app_input_type: dropdown
    label: Icon
    default: Soccer
    help: The picture drawn next to the day count.
    choices:
      - Archery
      - Badminton
      - Basketball
      - Bicycle
      - Billiards
      - Birthday
      - Chess
      - Church
      - Climbing
      - Darts
      - Dumbbell
      - Fishing
      - Football
      - Frisbee
      - Golf
      - Hockey
      - Hospital
      - Restaurant
      - Ring
      - School
      - Skiing
      - Soccer
      - Trash
      - Walking
  - key: numcolor1
    type: choice
    app_input_type: dropdown
    label: Color
    default: Pink
    help: The colour of the title and day count.
    choices:
      - Pink
      - Red
      - Orange
      - Yellow
      - Green
      - Cyan
      - Blue
      - Purple
      - White

  - key: accent
    type: choice
    app_input_type: dropdown
    label: Accent color
    default: Blue
    help: The edge rail down the left side.
    choices:
      - Pink
      - Red
      - Orange
      - Yellow
      - Green
      - Cyan
      - Blue
      - Purple
      - White
