gdn: 1
id: college-conference-standings
version: 0.1.0
name: College Conference Standings
author: glance-led-dev
description: FBS conference standings as a logo ladder - every school in order with its conference and overall record, leaders in gold - plus a hero card for the conference leader. Pick any FBS conference. No key needed.
category: Sports
entry: app.star

width: 192
height: 32
# The ladder steps four schools per refresh, so an 18-team conference cycles
# in ten minutes. ESPN's standings are cached 1800 s regardless - they move
# once a week.
refresh: 120

pages: [ladder, leader]

inputs:
  - key: conference
    type: choice
    app_input_type: dropdown
    label: Conference
    default: "SEC"
    help: The FBS conference to show. The Sun Belt shows its East and West divisions in turn; FBS Independents ranks Notre Dame and UConn by overall record (W-L) and shows their streaks.
    choices:
      - "SEC"
      - "BIG TEN"
      - "BIG 12"
      - "ACC"
      - "AMERICAN"
      - "MOUNTAIN WEST"
      - "SUN BELT"
      - "MAC"
      - "CONFERENCE USA"
      - "PAC-12"
      - "FBS INDEPENDENTS"
    options:
      - "SEC"
      - "BIG TEN"
      - "BIG 12"
      - "ACC"
      - "AMERICAN"
      - "MOUNTAIN WEST"
      - "SUN BELT"
      - "MAC"
      - "CONFERENCE USA"
      - "PAC-12"
      - "FBS INDEPENDENTS"

# FBS logos, one 40 x 24 (leader card) and one 24 x 18 (_S, ladder) per
# school, named by ESPN abbreviation (TA&M -> TAMU, M-OH -> MOH).
