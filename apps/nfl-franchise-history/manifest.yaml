gdn: 1
id: nfl-franchise-history
version: 0.1.0
name: NFL Franchise History
author: glance-led-dev
description: Every NFL club's logo and trophy shelf - the nickname in club colours, home market and founding year, and a Lombardi on the shelf for every Super Bowl win (a ghost for every loss) with a bronze cup for older league titles - then a new frame a minute - true history stories, the all-time series with its rival, and its most famous retired jersey. No key, no network.
category: Sports
entry: app.star

width: 192
height: 32
# 60 s because the trivia page shows a new frame every minute, and ALL TEAMS
# moves to the next club every 10 minutes. There is no network to spare -
# every story is baked in.
refresh: 1800

pages: [legacy, trivia]

# Team logos: 40 x 24 pixel art, one per club, named by ESPN abbreviation,
# plus the NFL shield.
assets:
  - assets/ARI.png
  - assets/ATL.png
  - assets/BAL.png
  - assets/BUF.png
  - assets/CAR.png
  - assets/CHI.png
