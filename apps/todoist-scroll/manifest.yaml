gdn: 1
id: todoist-scroll
version: 0.1.0
name: Todoist
author: glance-led-dev
description: What is due today and how far behind you are, from Todoist. Overdue and due-today are shown as separate numbers, because they are separate feelings.
category: Productivity
entry: app.star

width: 192
height: 32

refresh: 900

pages: [today, tasks]

inputs:
  - key: token
    type: string
    app_input_type: api-key
    label: Todoist API token
    default: ""
    help: >-
      Your personal API token, not an OAuth app. In Todoist: Settings >
      Integrations > Developer > API token. Leave blank to see the app running
      on sample tasks.
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    help: Pick the city nearest you. Daylight saving is applied automatically, so this never needs changing twice a year.
    choices:
      - "Pacific/Honolulu"
      - "America/Anchorage"
      - "America/Los_Angeles"
      - "America/Phoenix"
      - "America/Denver"
      - "America/Chicago"
      - "America/Mexico_City"
      - "America/New_York"
