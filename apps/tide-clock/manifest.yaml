gdn: 1
id: tide-clock
version: 0.1.0
name: Tide Clock
author: glance-led-dev
description: The next high and low tide for any NOAA station, and which way the water is moving.
category: Weather
entry: app.star

width: 64
height: 32
refresh: 3600

pages: [tides]

assets:
  - TIDE.png

inputs:
