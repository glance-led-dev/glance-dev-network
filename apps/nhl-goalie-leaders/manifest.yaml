id: nhl-goalie-leaders
name: NHL Goalie Leaders
author: cfdmb
description: Top 3 goalie leaders by category, for NHL, Eastern, or Western Conference - regular season or playoffs, switching on its own in the spring.
category: Sports
width: 192
height: 32
refresh: 10800
pages:
  - gaa
  - savepct
  - wins
  - shutouts
  - saves
  - games
  - points
  - pim
inputs:
  - key: league
    type: string
    app_input_type: dropdown
    label: Conference
    choices: [NHL, EAST, WEST]
    default: NHL
  - key: stats
    type: string
    app_input_type: dropdown
    label: Stats
    choices: [Auto, Regular season, Playoffs]
    default: Auto
    help: "Auto: playoffs while they're on, regular season otherwise. Playoff GAA/SV% need 50% of the fewest games played by a team still alive (shown as 4+ GP)."
