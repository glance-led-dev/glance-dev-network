inputs:
  - key: activeonly
    type: choice
    app_input_type: checkbox
    label: Only show active games
    default: true
    help: Shows live and completed games while hiding games that have not started.

  - key: scoreeffect
    type: choice
    app_input_type: dropdown
    label: Scoring animation
    default: team-colors
    choices: [team-colors, flash, scoreboard, none]
    help: Selects the visual scoring style.