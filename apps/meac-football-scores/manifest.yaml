gdn: 1
id: meac-football-scores
version: 0.4.1
name: MEAC Football Scores
author: TAS
description: Live MEAC football scores, schedules, records, team branding, and final results.
category: Sports
entry: app.star
width: 192
height: 32
refresh: 60
pages: [intro, game1, game2, game3, game4, game5, game6]

assets:
  - meac-logo.png

  - delaware-state.png
  - howard.png
  - morgan-state.png
  - nc-central.png
  - norfolk-state.png
  - sc-state.png

  - alabama-am.png
  - albany.png
  - arizona-state.png
  - bethune-cookman.png
  - campbell.png
  - charleston-southern.png
  - chicago-state.png
  - east-carolina.png
  - florida-am.png
  - furman.png
  - gardner-webb.png
  - hampton.png
  - indiana.png
  - nc-at.png
  - old-dominion.png
  - penn.png
  - richmond.png
  - robert-morris.png
  - south-florida.png
