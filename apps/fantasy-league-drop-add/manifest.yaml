gdn: 1
id: fantasy-league-drop-add
version: 0.1.0
name: Drop & Add
author: glance-led-dev
description: The best waiver moves for your own ESPN or Sleeper fantasy team - your weakest player against the best free agent at his spot (or at FLEX), with the rest-of-season points per week you gain, % owned or the waiver status, and your next moves. Enter your league ID and team name.
category: Sports
entry: app.star

width: 192
height: 32
# 900 s: the league ID and team are free text (the under-5-minute rule
# allows only dropdown / checkbox / selection inputs), and rosters, season
# stats and projections move a few times a day at most.
refresh: 900

pages: [move, next_moves]

assets:
  - ARI.png
  - ATL.png
  - BAL.png
  - BUF.png
  - CAR.png
  - CHI.png
  - CIN.png
  - CLE.png
  - DAL.png
  - DEN.png
  - DET.png
  - GB.png
  - HOU.png
  - IND.png
  - JAX.png
  - KC.png
  - LAC.png
  - LAR.png
  - LV.png
  - MIA.png
  - MIN.png
  - NE.png
  - NO.png
  - NYG.png
  - NYJ.png
  - PHI.png
  - PIT.png
  - SEA.png
  - SF.png
  - TB.png
  - TEN.png
  - WSH.png

inputs:
  - key: league
    type: string
    app_input_type: free-text
    label: League ID
    default: ""
    help: "The number in your league's web address - ESPN (leagueId=...) or Sleeper (sleeper.com/leagues/...). Leave blank for a demo."
  - key: team
    type: string
    app_input_type: free-text
    label: Your team
    default: ""
    help: "Your team name or your manager / username. Part of it is fine, any case."
  - key: platform
    type: choice
    app_input_type: dropdown
    label: Platform
    default: "AUTO"
    help: "AUTO works it out from the ID (Sleeper IDs are 18-19 digits). Yahoo leagues are not supported - Yahoo needs a sign-in a panel can't do."
    choices:
      - "AUTO"
      - "ESPN"
      - "SLEEPER"
    options:
      - "AUTO"
      - "ESPN"
      - "SLEEPER"
  - key: espns2
    type: string
    app_input_type: api-key
    label: ESPN espn_s2 cookie (private leagues only)
    default: ""
    help: "Only for PRIVATE ESPN leagues. In a desktop browser logged into ESPN, open your league, then DevTools > Application > Cookies > espn.com and copy espn_s2."
  - key: swid
    type: string
    app_input_type: api-key
    label: ESPN SWID cookie (private leagues only)
    default: ""
    help: "Only for PRIVATE ESPN leagues. From the same cookie list, copy SWID (the value in curly braces)."
