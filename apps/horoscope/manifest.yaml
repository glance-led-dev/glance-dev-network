gdn: 1
id: horoscope
version: 0.3.0
name: Horoscope
author: reyos86
description: Daily zodiac vibes for the signs you pick — glyph plus a short punchline on the Scroll.
category: Lifestyle
entry: app.star
width: 192
height: 32
# Re-render often enough to rotate through multiple signs; API TTL still caches readings.
refresh: 1800
pages: [main]

inputs:
  - key: sign1
    type: choice
    app_input_type: dropdown
    label: Sign 1
    default: aries
    choices: [aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
    help: First (or only) sign to show. Tap to pick — works fine on phones.

  - key: sign2
    type: choice
    app_input_type: dropdown
    label: Sign 2
    default: none
    choices: [none, aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
    help: Optional second sign. Leave as none to show only Sign 1.

  - key: sign3
    type: choice
    app_input_type: dropdown
    label: Sign 3
    default: none
    choices: [none, aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
    help: Optional third sign. Leave as none if unused.

  - key: sign4
    type: choice
    app_input_type: dropdown
    label: Sign 4
    default: none
    choices: [none, aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
    help: Optional fourth sign. Leave as none if unused.

assets:
  - aries.png
  - taurus.png
  - gemini.png
  - cancer.png
  - leo.png
  - virgo.png
  - libra.png
  - scorpio.png
  - sagittarius.png
  - capricorn.png
  - aquarius.png
  - pisces.png
