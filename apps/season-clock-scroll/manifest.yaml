gdn: 1
id: season-clock-scroll
version: 0.1.0
name: Season Clock
author: glance-led-dev
description: Where you are in the year's wheel, and how long until the season turns.
category: Time
entry: app.star

width: 192
height: 32
refresh: 14400

pages: [wheel, next]

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: US zip code. Sets your timezone, daylight saving included.
