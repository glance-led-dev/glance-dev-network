
gdn: 1
id: lake-michigan-marine
version: 0.5.4
name: "Chicago NWI Marine Conditions"
author: "G Goodwin"
description: "Southern Lake Michigan live conditions, warnings, and plain-language nearshore/offshore forecasts by selected marine area."
category: Weather
entry: app.star
width: 128
height: 32
refresh: 300

pages: [conditions, advisories, alert_list, details, outlook1, outlook2, outlook3, outlook4]

inputs:
  - key: showconditions
    type: string
    app_input_type: checkbox
    label: Show current conditions
    default: "true"
    help: "Wind and gusts at left; waves and water temperature at right. Current wind and wave readings expire at 60 minutes, water at 4 hours. WAVE FCST means predicted waves; WAVE means a measured buoy reading."

  - key: showwarnings
    type: string
    app_input_type: checkbox
    label: Show NWS marine warnings
    default: "true"
    help: "Includes area summary, grouped active bulletins, and details. NONE means no active NWS warning found, not safe conditions. N/A means feed unavailable."

  - key: showforecast
    type: string
    app_input_type: checkbox
    label: Show marine forecasts
    default: "true"
    help: "Four adaptive forecast screens show weather, wind in knots, waves in feet, and changes. 1 group shows four periods; 2 groups show two each; 3 groups show one each plus an extra; 4 or more show one per group. More than four groups rotate across refreshes."

  - key: forecastperiod
    type: choice
    app_input_type: selection
    label: Forecast period (all selected areas)
    default: "Auto (adaptive)"
    choices:
      - "Auto (adaptive)"
      - "Today"
      - "Tonight"
      - "Tomorrow"
      - "Tomorrow Night"
      - "Rotate periods"
    help: "Auto uses the earliest NWS forecast periods, then allocates any remaining screens to later periods. Select Today, Tonight, Tomorrow, or Tomorrow Night to focus those periods, if NWS publishes them. Rotate periods cycles displayed time windows on five-minute updates when four or more distinct groups are selected."

  - key: windstation
    type: choice
    app_input_type: selection
    label: Wind stations (choose any)
    default: "Calumet Harbor (CMTI2)"
    choices:
      - "All wind stations"
      - "Calumet Harbor (CMTI2)"
      - "Harrison-Dever Crib (CHII2)"
      - "Navy Pier (CNII2)"
      - "Chicago Buoy (45198)"
      - "Wilmette Buoy (45174)"
      - "Michigan City Buoy (45170)"
    help: "Uses the freshest selected station reporting usable wind within the last 60 minutes. KT = knots."

  - key: wavebuoy
    type: choice
    app_input_type: selection
    label: Wave and water-temperature buoys
    default: "South Michigan Spotter (45214)"
    choices:
      - "All wave buoys"
      - "South Michigan Spotter (45214)"
      - "Chicago Buoy (45198)"
      - "Wilmette Buoy (45174)"
      - "Michigan City Buoy (45170)"
    help: "Waves in feet and water temperature in Fahrenheit. If no recent buoy wave exists, a labeled nearshore forecast can be shown. Water history checks are capped to avoid GLANCE's HTTP limit."

  - key: marinezones
    type: choice
    app_input_type: selection
    label: Marine warning areas (select any)
    default: "Northerly Island - Calumet (LMZ742), Calumet - Gary (LMZ743)"
    choices:
      - "All supported areas"
      - "All nearshore areas"
      - "All offshore areas"
      - "Winthrop - Wilmette (LMZ740)"
      - "Wilmette - Northerly Island (LMZ741)"
      - "Northerly Island - Calumet (LMZ742)"
      - "Calumet - Gary (LMZ743)"
      - "Gary - Burns Harbor (LMZ744)"
      - "Burns Harbor - Michigan City (LMZ745)"
      - "Michigan City - New Buffalo (LMZ046)"
      - "New Buffalo - St. Joseph (LMZ043)"
      - "Offshore Winthrop - Wilmette (LMZ777)"
      - "Offshore Wilmette - Michigan City (LMZ779)"
      - "Offshore Michigan City - St. Joseph (LMZ080)"
    help: "Selected NWS warning zones, including waters more than 5 nautical miles offshore. Warnings for more than six selected zones use alternating summary screens. An O suffix indicates an offshore zone."

  - key: forecastzones
    type: choice
    app_input_type: selection
    label: Marine forecast areas (select any)
    default: "Wilmette - Northerly Island (LMZ741), Northerly Island - Calumet (LMZ742), Calumet - Gary (LMZ743), Gary - Burns Harbor (LMZ744), Burns Harbor - Michigan City (LMZ745), Michigan City - New Buffalo (LMZ046)"
    choices:
      - "All supported areas"
      - "All nearshore areas"
      - "All offshore areas"
      - "Use my warning areas"
      - "Winthrop - Wilmette (LMZ740)"
      - "Wilmette - Northerly Island (LMZ741)"
      - "Northerly Island - Calumet (LMZ742)"
      - "Calumet - Gary (LMZ743)"
      - "Gary - Burns Harbor (LMZ744)"
      - "Burns Harbor - Michigan City (LMZ745)"
      - "Michigan City - New Buffalo (LMZ046)"
      - "New Buffalo - St. Joseph (LMZ043)"
      - "Offshore Winthrop - Wilmette (LMZ777)"
      - "Offshore Wilmette - Michigan City (LMZ779)"
      - "Offshore Michigan City - St. Joseph (LMZ080)"
    help: "Pick waters along your route, or offshore for crossings. NWS can publish one forecast for several adjacent zones. The title shows a single chosen area when possible, or its shared shoreline. This is not an entire-lake route forecast. With four or more distinct groups, use Forecast period to see Tonight or Tomorrow; Rotate periods changes the period automatically."
