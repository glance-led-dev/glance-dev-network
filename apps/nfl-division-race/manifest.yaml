gdn: 1
id: nfl-division-race
version: 0.1.0
name: NFL Division Race
author: glance-led-dev
description: Your NFL team's division race - a conference banner and all four club logos in standings order with record and streak, the leader in gold - plus a team card with record, place, playoff seed, streak, point differential and games behind or magic number. From ESPN, no key needed.
category: Sports
entry: app.star

width: 192
height: 32
# Standings only move when a game ends, so every 30 minutes is plenty; the
# ESPN fetch is cached for the same 1800 s.
refresh: 14400

pages: [race, team]

# Team logos: 40 x 24 pixel art, one per club, named by ESPN abbreviation,
# plus the NFL shield for a club the feed does not name.
assets:
  - ARI.png
  - ATL.png
  - BAL.png
  - BUF.png
  - CAR.png
  - CHI.png
  - CIN.png
  - CLE.png
  - DAL.png
  - DEN.png
  - DET.png
  - GB.png
  - HOU.png
  - IND.png
  - JAX.png
  - KC.png
  - LV.png
  - LAC.png
  - LAR.png
  - MIA.png
  - MIN.png
  - NE.png
  - NO.png
  - NYG.png
  - NYJ.png
  - PHI.png
  - PIT.png
  - SF.png
  - SEA.png
  - TB.png
  - TEN.png
  - WSH.png
  - NFL.png

