gdn: 1
id: sps-athletics-upcoming
version: 0.1.0
name: SPS Upcoming Games
author: csmith
description: >-
  St. Paul's School (Big Red) games this week, across every team (Varsity,
  JV, JV-B) — schedule and score in one place. Shows the upcoming time until
  a game is played, then updates in place to the final score. Only real
  games show — a day with nothing scheduled is skipped entirely rather than
  padded with a blank. Companion to "SPS Recent Results", a dedicated
  scores-only view of the same games. Rolls to next week every Monday.
category: Sports
entry: app.star

# Panel geometry. Height is 32 (fixed); width up to 384.
width: 192
height: 32

# Seconds between re-renders (minimum 60 for public apps).
refresh: 300

# 7 game slots (each picks from this week's actual games, skipping empty
# days — see week_matches() in app.star) + 1 "this week" cover page = 8, the
# platform's hard per-app maximum (gdn/data/scene.schema.json,
# "pages": {"maxItems": 8}). All 8 pages share the same two http.get calls
# (this month + next month of the combined calendar).
pages:
  - this_week
  - slot1
  - slot2
  - slot3
  - slot4
  - slot5
  - slot6
  - slot7

