gdn: 1
id: progress-clock-scroll
version: 0.1.0
name: Progress Clock
author: glance-led-dev
description: The day as a set of filling bars — hour, day and year all at once.
category: Time
entry: app.star

width: 192
height: 32
refresh: 300

pages: [bars, dial]

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: US zip code. Sets your timezone, daylight saving included.
  - key: accent
    type: string
    app_input_type: color
    label: Accent color
    default: "#39D98A"
