gdn: 1
id: trash-day
version: 0.1.0
name: Trash Day
author: glance-led-dev
description: "Which bins go out tonight, drawn so you can read it from the hallway."
category: Lifestyle
entry: app.star

width: 64
height: 32
refresh: 21600

pages: [bins]

assets:
  - BINTRASH.png
  - BINRECYCLE.png
  - BINYARD.png

inputs:
  - key: day
    type: choice
    app_input_type: dropdown
    label: Collection day
    default: "MONDAY"
    choices: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"]
  - key: garbage
    type: choice
    app_input_type: dropdown
    label: Garbage
    default: "EVERY WEEK"
    help: If your town collects garbage every other week, pick "This Week" or "Next Week" (either one), save, then check the preview -- if the upcoming pickup it shows doesn't match your real bin schedule, switch to the other option. After that one check it stays correct on its own.
    choices: ["EVERY WEEK", "THIS WEEK", "NEXT WEEK", "NEVER"]
  - key: recycling
    type: choice
    app_input_type: dropdown
    label: Recycling
    default: "THIS WEEK"
    help: Same idea as Garbage above -- pick "This Week" or "Next Week", check the preview against your real schedule, and flip it if it's showing the wrong week.
    choices: ["EVERY WEEK", "THIS WEEK", "NEXT WEEK", "NEVER"]
  - key: yard
    type: choice
    app_input_type: dropdown
    label: Yard waste
    default: "EVERY WEEK"
    help: Same idea as Garbage above -- pick "This Week" or "Next Week", check the preview against your real schedule, and flip it if it's showing the wrong week.
    choices: ["EVERY WEEK", "THIS WEEK", "NEXT WEEK", "NEVER"]
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "America/New_York"
    help: Pick the city nearest you. Daylight saving is applied automatically, so this never needs changing twice a year.
    choices:
      - "Pacific/Honolulu"
      - "America/Anchorage"
      - "America/Los_Angeles"
      - "America/Phoenix"
      - "America/Denver"
      - "America/Chicago"
