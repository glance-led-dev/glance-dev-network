gdn: 1
id: frost-watch-scroll
version: 0.1.0
name: Frost Watch
author: glance-led-dev
description: Tonight's low, and whether the garden needs covering before dark.
category: Weather
entry: app.star

width: 192
height: 32
refresh: 3600

pages: [tonight]

# No assets: the identity art is baked into app.star as c.sprite string
# art, which recolours per frost band instead of shipping one flat PNG.

inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "10001"
    help: US zip code. Sets the location.
  - key: units
    type: choice
    app_input_type: dropdown
    label: Units
    default: "IMPERIAL"
    choices: ["IMPERIAL", "METRIC"]
