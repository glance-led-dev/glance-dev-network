gdn: 1
id: tide-chart
version: 0.1.0
name: Tide Chart
author: reyos86
description: Next high/low tides, today's schedule, live wind/water conditions, and NWS alerts for a NOAA marine station — by zip (nearest within 50 mi) or station ID. No API key required.
category: Weather
entry: app.star
width: 192
height: 32
# Predictions are stable; refresh a few times an hour is plenty.
refresh: 3600
pages: [tide, today, conditions]
inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "92101"
    help: Used only when Tide station is left on "Nearest to my zip code". Finds the nearest NOAA gauge within 50 miles.
  - key: station
    type: choice
    app_input_type: dropdown
    label: Tide station
    default: "Nearest to my zip code"
    help: Leave it on the default to use the station nearest your zip code, or pick one of NOAA's 237 tide gauges directly. Every entry here is a real gauge that publishes predictions.
