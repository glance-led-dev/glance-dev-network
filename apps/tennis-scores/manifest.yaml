gdn: 1
id: tennis-scores
version: 0.1.0
name: Tennis Scores
author: DanielSavitsky32
description: Live ATP or WTA singles scores, one match per page - set-by-set scores, the server, the round, today's results and what's up next.
category: Sports
entry: app.star

width: 64
height: 32

refresh: 300

pages: [p1, p2, p3, p4, p5, p6, p7, p8]

inputs:
  - key: tour
    type: choice
    app_input_type: dropdown
    label: Tour
    default: "ATP"
    choices:
      - "ATP"
      - "WTA"
    help: Which tour to follow. ATP is the men's tour, WTA the women's.