gdn: 1
id: tennis-scores
version: 0.1.0
name: Tennis Scores
author: dsavitsky
description: Live and recently completed ATP or WTA singles scores from a chosen tournament, with set-by-set scores, server indicator, and suspended-match highlighting.
category: Sports
entry: app.star
 
width: 64
height: 32
 
refresh: 900
 
pages: [p1, p2, p3, p4, p5]
 
inputs:
  - key: tour
    type: choice
    app_input_type: dropdown
    label: Tour
    default: "ATP"
    choices:
      - "ATP"
      - "WTA"
    help: Which tour to follow. ATP is the men's tour, WTA the women's.
 
  - key: tourneyid
    type: string
    app_input_type: free-text
    label: Tournament
    default: "auto"
    help: Leave as auto to follow whichever ATP event is running. Or paste an ESPN event id (e.g. 154-2025) to pin one.
 

