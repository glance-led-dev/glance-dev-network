gdn: 1
id: usmnt-tracker
version: 0.2.0
name: "National Team Tracker"
author: "Tim McCabe"
description: Follow any of 54 men's national soccer teams, including the USMNT, Mexico, England, Brazil and Argentina, with live scores, the next fixture and the last result across all competitions.
category: Sports
entry: app.star

width: 128
height: 32
refresh: 300

pages:
  - live_match
  - next_match
  - last_match

