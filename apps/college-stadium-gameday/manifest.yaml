gdn: 1
id: college-stadium-gameday
version: 0.1.0
name: College Stadium Gameday
author: glance-led-dev
description: The home stadiums of college football, drawn in pixel art - the nickname, capacity, the year it opened and the gameday stories that make it loud. For 58 FBS programs. No network needed.
category: Sports
entry: app.star

width: 192
height: 32
# 120 s: each refresh shows the next gameday story. With ALL SCHOOLS the
# school changes every 20 minutes so both pages show the same one.
refresh: 120

pages: [stadium, gameday]

# School logos, 40 x 24 pixel art, named by ESPN abbreviation.
