gdn: 1
id: github-repo-scroll
version: 0.1.0
name: GitHub Repo
author: glance-led-dev
description: Stars, forks and open issues for any public repository.
category: Other
entry: app.star

width: 192
height: 32
refresh: 1800

pages: [stats]

inputs:
  - key: repo
    type: string
    app_input_type: free-text
    label: Repository
    default: "glance-led-dev/glance-dev-network"
    help: "Owner and name only, like glance-led-dev/glance-dev-network. Not the full URL -- a pasted https:// link cannot reach the app, because the colon ends the value in transit."
