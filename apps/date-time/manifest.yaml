# GDN app manifest (v2). This file is the source of truth for how your app is
# configured and reviewed. Edit it in VS Code or the Studio.
gdn: 1
id: date-time
version: 0.2.0
name: Date & Weather
author: jdhine02
description: Today's date for a US zip code, big, beside the weather at a glance (place, condition icon, temperature, high and low), then a second page with chance of rain, sunrise, and sunset. Pick a date style and one of five colors each for the date, weather, and temperature.
category: Time
entry: app.star

# Panel geometry. Height is 32 (fixed); width up to 384.
width: 192
height: 32

# Weather moves on a 30-minute scale and there is no clock, so nothing needs a
# faster rate. The weather fetch's ttl_seconds matches (1800).
refresh: 3600

# Pages the panel rotates through, in order. app.star must define a function per name.
pages: [today, sky]

# What the client fills in at install time.
#   type            — the data type: string | number | choice
#   app_input_type  — the UI widget the client sees. One of:
#                     free-text | dropdown | selection | checkbox | date | date-past | color
#                     (optional; if omitted the form infers it from `type`)
inputs:
  - key: zip
    type: string
    app_input_type: free-text
    label: Zip code
    default: "90210"
    help: US zip code; sets the local date (daylight saving included) and the weather.

  - key: dateformat
    type: choice
    app_input_type: dropdown
    label: Date format
    default: "SEP 14"
    help: How the big date reads. The weekday always sits above it.
    choices: ["SEP 14", "14 SEP", "09/14", "14/09"]

  - key: datecolor
    type: choice
    app_input_type: dropdown
    label: Date color
    default: "White"
    choices: ["White", "Amber", "Green", "Cyan", "Red"]

  - key: weathercolor
    type: choice
    app_input_type: dropdown
    label: Weather color
    default: "White"
    choices: ["White", "Amber", "Green", "Cyan", "Red"]

  - key: tempcolormode
    type: choice
    app_input_type: dropdown
    label: Temperature color
    default: "White"
    choices: ["White", "Amber", "Green", "Cyan", "Red"]
