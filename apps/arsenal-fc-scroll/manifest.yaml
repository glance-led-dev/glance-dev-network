# GDN app manifest (v2).
gdn: 1
id: arsenal-fc-scroll
version: 0.1.0
name: Arsenal FC
author: chris-smith
description: Arsenal's live score, next fixture, last result, and Premier League table position — red-and-white with a cannon mark, no setup required.
category: Sports
entry: app.star

# Panel geometry. Height is 32 (fixed); width up to 384.
width: 192
height: 32

# MATCH's live score wants a fresher read than the others; 5 min balances
# that against hammering the shared free API key (the other lookups cache
# far longer via their own http.get ttl_seconds).
refresh: 300

# MATCH (live score, else next fixture) -> RESULT -> TABLE, rotating.
pages: [match, result, table]

# Arsenal's real 1921-22 club crest (public domain — see README.md),
# pixel-thresholded to 48x22 in Arsenal red for the mark.
assets:
  - cannon.png

# Kickoff times come from the API in the fixture's own local (UK) time.
# This converts to standard time in the chosen zone; it does not adjust
# for daylight saving (see the comment on TZ_OFFSET in app.star).
inputs:
  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Kickoff time zone
    default: "UK"
    choices: ["UK", "US EASTERN", "US CENTRAL", "US MOUNTAIN", "US PACIFIC", "CENTRAL EUROPE"]
    help: Converts kickoff time from the ground's local time. Standard time only, not daylight saving.

  - key: apikey
    type: string
    app_input_type: api-key
    label: Football-data.org API key (optional)
    help: Optional — makes RESULT more reliable (TheSportsDB's free key can lag days behind). Free key at football-data.org, see README.md. Leave blank to use the free source as-is.
