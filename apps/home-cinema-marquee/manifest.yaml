inputs:
  - key: cinema
    type: string
    app_input_type: free-text
    label: Cinema name
    default: "THE BASEMENT CINEMA"
    help: The name on the marquee banner. Shown in caps; scales to fit.
  - key: lbuser
    type: string
    app_input_type: free-text
    label: Letterboxd username
    default: "abartos27"
    help: Public Letterboxd account; the newest logged film becomes tonight's feature. Leave blank to run on the curated canon only.
  - key: mode
    type: choice
    app_input_type: dropdown
    label: Showcase
    default: recent watches
    options: [recent watches, favorites, custom list]
    help: What the three-up strip plays. RECENT WATCHES follows your Letterboxd diary, newest first. FAVORITES is the four films pinned on your profile. CUSTOM LIST plays a public list - set the slug below. Now Showing always plays your latest watch, whichever you pick.
  - key: lblist
    type: string
    app_input_type: free-text
    label: List slug (custom list only)
    default: "top-10"
    help: Used only when the source is LIST. The last path segment of a public list URL, e.g. letterboxd.com/abartos27/list/TOP-10/ -> top-10.
