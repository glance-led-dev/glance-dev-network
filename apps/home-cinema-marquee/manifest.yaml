gdn: 1
id: home-cinema-marquee
version: 0.1.0
name: The Basement Cinema
author: abartos27
description: "A NOW SHOWING marquee for a home theater: tonight's feature from Letterboxd - a recent watch, a curated Top 4, or any public list - with hand-drawn poster art."
category: Entertainment
entry: app.star

width: 384
height: 32
refresh: 60

pages: [marquee, now_showing, showcase]

