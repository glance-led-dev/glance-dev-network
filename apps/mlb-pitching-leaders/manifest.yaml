id: mlb-pitching-leaders
name: MLB Pitching Leaders
author: cfdmb
description: Top 3 pitching leaders by category, for MLB, AL, or NL - regular season or postseason, switching on its own in October.
category: Sports
width: 192
height: 32
refresh: 14400
pages:
  - era
  - k
  - wins
  - saves
  - ip
  - games
  - whip
  - k9
inputs:
  - key: league
    type: string
    app_input_type: dropdown
    label: League
    choices: [MLB, AL, NL]
    default: MLB
  - key: stats
    type: string
    app_input_type: dropdown
    label: Stats
    choices: [Auto, Regular season, Postseason]
    default: Auto
    help: "Auto: postseason in October, regular season otherwise. Postseason ERA/WHIP/K9 need 1 IP x the fewest games played by a team still alive (shown as 3+ IP)."
