inputs:
- key: team
  type: choice
  app_input_type: dropdown
  label: Follow a team
  default: ALL
  choices:
  - ALL
  - ARI
  - ATL
  - BAL
  - BUF
  - CAR
  - CHI
  - CIN
  - CLE
  - DAL
  - DEN
  - DET
  - GB
  - HOU
  - IND
  - JAX
  - KC
  - LAC
  - LAR
  - LV
  - MIA
  - MIN
  - NE
  - 'NO'
  - NYG
  - NYJ
  - PHI
  - PIT
  - SEA
  - SF
  - TB
  - TEN
  - WSH
  help: ALL shows a live game first, otherwise the next kickoff. A team selection
    follows its next game within 21 days.
- key: timezone
  type: choice
  app_input_type: dropdown
  label: Kickoff time zone
  default: STADIUM LOCAL
  choices:
  - STADIUM LOCAL
  - ET
  - CT
  - MT
  - PT
  - UTC
  help: Converts kickoff date and time to your chosen zone and shows its label. ET, CT, MT and PT automatically follow daylight saving time. Stadium local preserves the venue time. Weather remains tied to the stadium and actual kickoff.
- key: units
  type: choice
  app_input_type: dropdown
  label: Weather units
  default: F / MPH
  choices:
  - F / MPH
  - C / KMH
- key: mode
  type: choice
  app_input_type: dropdown
  label: Display mode
  default: LIVE DATA
  choices:
  - LIVE DATA
  - DEMO KICKOFF
  - DEMO LIVE
  help: Demo is labelled DEMO and uses fictional scores and weather. The followed team is at home versus GB (CHI if you follow GB). ALL shows GB at Chicago. Kickoff converts to your selected time zone.
