gdn: 1
id: game-day-weather
version: 1.3.0
name: Game Day Weather
author: community
description: NFL matchups with stadium weather at kickoff, live scores and current
  outdoor conditions.
category: Sports
entry: app.star
width: 192
height: 32
refresh: 60
pages:
- gameday
assets:
- assets/ari.png
- assets/atl.png
- assets/bal.png
- assets/buf.png
- assets/car.png
- assets/chi.png
- assets/cin.png
- assets/cle.png
- assets/dal.png
- assets/den.png
- assets/det.png
- assets/gb.png
- assets/hou.png
- assets/ind.png
- assets/jax.png
- assets/kc.png
