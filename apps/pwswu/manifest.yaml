id: pwswu
name: PWS Weather Underground
author: Brayden Slater
description: Personal Weather Station display with current conditions, wind, and rain data from Weather Underground
width: 192
height: 32
refresh: 1800
pages:
  - main
  - wind
  - rain
inputs:
  - key: temperatureunit
    type: choice
    app_input_type: dropdown
    label: Temperature Unit
    choices: [Fahrenheit (English / Imperial), Celsius (Metric)]
    default: Fahrenheit (English / Imperial)
  - key: apikey
    label: Weather Underground API Key
    type: api-key
    default: ""
    help: "Get this from your WU Account → My Devices → API Keys Tab"  
  - key: stationid
    label: PWS Station ID
    type: free-text
    default: ""
    help: "Your Weather Underground station ID"
  - key: location
    label: City Label (Optional)
    type: free-text
    default: ""
    help: "Custom name shown on the display (e.g. Home)"
  
assets:
  - barometer.png
  - clear-day.png
  - clear-night.png
  - cloudy.png
  - drizzle.png
  - extreme-rain.png
  - extreme.png
  - fog-day.png
  - fog-night.png
  - humidity.png
  - overcast.png
  - partly-cloudy-night.png
  - partly-sun-day.png
  - rain.png
  - raindrops.png
  - sleet.png
  - snow.png
  - thermometer-raindrop.png
  - thermometer-sun.png
  - thunderstorms-extreme-rain.png
  - thunderstorms-overcast.png
  - thunderstorms-rain.png
  - tornado.png
  - umbrella-wind.png
  - uv-index.png
  - wind.png
  - WUnderground.png
