gdn: 1
id: multi-sport-tracked-teams
version: 0.1.0
name: "Multi-Sport Tracked Teams"
author: "Tim McCabe"
description: Track your favorite NFL, MLB, NBA, NHL, and MLS teams in one app. Shows a live game when playing or the team's next matchup.
category: Sports
entry: app.star

width: 128
height: 32
refresh: 60

pages: [title, nfl_page, mlb_page, nba_page, nhl_page, mls_page]

