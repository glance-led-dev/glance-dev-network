gdn: 1
id: math-clock-scroll
version: 0.1.0
name: Math Clock
author: glance-led-dev
description: Read the time by solving it — each unit shown as a small arithmetic problem.
category: Fun
entry: app.star

width: 192
height: 32
refresh: 60

pages: [solve]

inputs:
  - key: zone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "EASTERN"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "ARIZONA", "PACIFIC", "ALASKA", "HAWAII"]
    help: Daylight saving is applied automatically.
